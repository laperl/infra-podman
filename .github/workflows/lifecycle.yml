---
# SPEC 5.4: deploy on a throwaway runner with rootless Podman and systemd user services,
# re-apply expecting zero changes, and destroy keeping the volume.
# Runner ubuntu-24.04 (Podman 4.9, the minimum) for the laptop's services.
# Never uses KeePassXC: any secret is generated here at random.
name: lifecycle

"on":
  pull_request:
    paths:
      - roles/**
      - playbooks/**
      - plugins/**
      - ansible.cfg
      - scripts/requirements-lint.txt
      - tests/lifecycle/**
      - docs/OPERATIONS.md
      - .github/workflows/lifecycle.yml
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash: GitHub then adds -o pipefail, so "playbook | tee" fails when the playbook fails.
defaults:
  run:
    shell: bash

concurrency:
  group: lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The runner image sets XDG_* for its own user in /etc/environment, and PAM hands it to
      # every user's systemd manager: svc_runner's would look for its Quadlet units in
      # /home/runner/.config. A real server does not do this.
      - name: Make the runner look like a normal server
        run: |
          grep '^XDG_' /etc/environment || true
          sudo sed -i '/^XDG_/d' /etc/environment

      - name: Install Podman 4.9 from Ubuntu 24.04
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman --version | grep -Eq ' 4\.9\.' || { echo "Expected Podman 4.9"; exit 1; }

      - name: Install pinned ansible-core
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --requirement scripts/requirements-lint.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Plan before anything exists (check mode)
        run: tests/lifecycle/playbook.sh -i tests/lifecycle/inventory.yml playbooks/base.yml --check --diff

      - name: Apply
        run: tests/lifecycle/playbook.sh -i tests/lifecycle/inventory.yml playbooks/base.yml --diff

      - name: Apply again, expecting zero changes (SPEC 4.2)
        run: |
          tests/lifecycle/playbook.sh -i tests/lifecycle/inventory.yml playbooks/base.yml | tee second.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second.log || { echo "The second apply changed something"; exit 1; }

      - name: Plan after apply, expecting zero changes
        run: |
          tests/lifecycle/playbook.sh -i tests/lifecycle/inventory.yml playbooks/base.yml --check | tee plan.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' plan.log || { echo "The plan after apply shows changes"; exit 1; }

      - name: Check the result as the operator would
        run: tests/lifecycle/check-base.sh svc_runner

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INV: tests/lifecycle/inventory.yml
      APPS: -e @tests/lifecycle/apps-vars.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The runner image sets XDG_* for its own user in /etc/environment, and PAM hands it to
      # every user's systemd manager: svc_runner's would look for its Quadlet units in
      # /home/runner/.config. A real server does not do this.
      - name: Make the runner look like a normal server
        run: |
          grep '^XDG_' /etc/environment || true
          sudo sed -i '/^XDG_/d' /etc/environment

      - name: Install Podman 4.9 from Ubuntu 24.04
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman --version | grep -Eq ' 4\.9\.' || { echo "Expected Podman 4.9"; exit 1; }

      - name: Install pinned ansible-core
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --requirement scripts/requirements-lint.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Service user (playbook base)
        run: tests/lifecycle/playbook.sh -i "$INV" playbooks/base.yml

      - name: Plan before the secret exists, expecting a clear refusal
        run: |
          if ansible-playbook -i "$INV" playbooks/postgres.yml --check > refusal.log 2>&1; then
            echo "::error::postgres ran without its secret"; exit 1
          fi
          grep -q 'deploy.sh secrets' refusal.log || { cat refusal.log; echo "::error::unexpected refusal"; exit 1; }

      # Random, thrown away with the runner. Never KeePassXC (SPEC 5.4).
      - name: Create the superuser secret with a random value
        run: |
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          echo "$pw" > "$RUNNER_TEMP/pw"
          printf '%s' "$pw" | tests/lifecycle/as-svc.sh podman secret create dev-pg-main-superuser-password -

      - name: Plan (nothing deployed yet)
        run: tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml --check --diff 2>&1 | tee -a all.log

      - name: Apply
        run: tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml --diff 2>&1 | tee -a all.log

      - name: Apply again, expecting zero changes (SPEC 4.2)
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml 2>&1 | tee second.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second.log || { echo "::error::the second apply changed something"; exit 1; }

      - name: Plan after apply, expecting zero changes
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml --check 2>&1 | tee plan.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' plan.log || { echo "::error::the plan after apply shows changes"; exit 1; }

      - name: Running, healthy, no published ports
        run: tests/lifecycle/check-postgres.sh running

      - name: Follows docs/POSTGRES.md (parameters, hardening, backup, pg_hba.conf)
        run: tests/lifecycle/check-postgres.sh standard

      - name: Write a marker row
        run: tests/lifecycle/check-postgres.sh write

      - name: Survives a restart of its service
        run: |
          tests/lifecycle/as-svc.sh systemctl --user restart dev-pg-main.service
          for _ in $(seq 1 30); do tests/lifecycle/as-svc.sh podman healthcheck run dev-pg-main && break; sleep 3; done
          tests/lifecycle/check-postgres.sh running
          tests/lifecycle/check-postgres.sh read

      - name: A changed pg_hba.conf is reloaded, not restarted
        run: |
          started=$(tests/lifecycle/as-svc.sh podman inspect dev-pg-main --format '{{.State.StartedAt}}')
          home=$(getent passwd svc_runner | cut -d: -f6)
          (cd / && sudo -u svc_runner sed -i '1s/^/# changed by lifecycle\n/' "$home/.config/infra-podman/dev-pg-main/pg_hba.conf")
          # sed -i, like Ansible, writes a new file: PostgreSQL must see it (the directory is mounted).
          tests/lifecycle/as-svc.sh podman exec dev-pg-main grep -q 'changed by lifecycle' /etc/postgresql/pg_hba.conf \
            || { echo "::error::the container does not see the new pg_hba.conf"; exit 1; }
          tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml 2>&1 | tee hba.log | tee -a all.log
          if ! grep -A2 'Reload pg_hba.conf' hba.log | grep -q '^changed:'; then
            echo "::error::the playbook did not reload pg_hba.conf: $(grep -A2 'pg_hba' hba.log | tr '\n' ' ')"; exit 1
          fi
          tests/lifecycle/as-svc.sh podman logs dev-pg-main 2>&1 | grep -q 'received SIGHUP, reloading configuration files' \
            || { echo "::error::PostgreSQL did not reload its configuration"; exit 1; }
          [[ $(tests/lifecycle/as-svc.sh podman inspect dev-pg-main --format '{{.State.StartedAt}}') == "$started" ]] \
            || { echo "::error::PostgreSQL was restarted for a pg_hba.conf change"; exit 1; }
          tests/lifecycle/check-postgres.sh read

      # Phase 2 (docs/POSTGRES.md, 2 and 3): the same instance, now with application
      # databases, as in production: PostgreSQL leaves Network=none for one internal,
      # isolated network per consumer.
      - name: Application databases are refused without the secrets of their users
        run: |
          if ansible-playbook -i "$INV" $APPS playbooks/postgres.yml --check > refusal.log 2>&1; then
            echo "::error::postgres ran without the secrets of its users"; exit 1
          fi
          grep -q 'dev-demo-app-db-password' refusal.log || { cat refusal.log; echo "::error::unexpected refusal"; exit 1; }

      - name: Create the secrets of the users with random values
        run: |
          for user in demo_app demo_rw demo_ro demo_ai; do
            v=$(openssl rand -hex 24)
            echo "::add-mask::$v"
            echo "$v" >> "$RUNNER_TEMP/pw"
            printf '%s' "$v" | tests/lifecycle/as-svc.sh podman secret create "dev-${user//_/-}-db-password" -
          done

      - name: Plan, apply, apply again (zero changes), plan again (zero changes)
        run: |
          tests/lifecycle/playbook.sh -i "$INV" $APPS playbooks/postgres.yml --check --diff 2>&1 | tee -a all.log
          tests/lifecycle/playbook.sh -i "$INV" $APPS playbooks/postgres.yml --diff 2>&1 | tee -a all.log
          tests/lifecycle/playbook.sh -i "$INV" $APPS playbooks/postgres.yml 2>&1 | tee second.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second.log || { echo "::error::the second apply changed something"; exit 1; }
          tests/lifecycle/playbook.sh -i "$INV" $APPS playbooks/postgres.yml --check 2>&1 | tee plan.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' plan.log || { echo "::error::the plan after apply shows changes"; exit 1; }
          tests/lifecycle/check-postgres.sh read

      - name: One internal, isolated network per consumer, and pg_hba.conf per user
        run: tests/lifecycle/check-postgres-apps.sh networks

      - name: Groups, users, database and schema follow docs/POSTGRES.md
        run: tests/lifecycle/check-postgres-apps.sh catalog

      - name: Owner creates as _owner, _reader cannot modify anything (R35, R36)
        run: tests/lifecycle/check-postgres-apps.sh access

      - name: No way out of the networks (internet, host, other consumers)
        run: tests/lifecycle/check-postgres-apps.sh isolation

      - name: A rotated secret changes the password, once
        run: |
          v=$(openssl rand -hex 24)
          echo "::add-mask::$v"
          echo "$v" >> "$RUNNER_TEMP/pw"
          tests/lifecycle/as-svc.sh podman secret rm dev-demo-rw-db-password
          printf '%s' "$v" | tests/lifecycle/as-svc.sh podman secret create dev-demo-rw-db-password -
          tests/lifecycle/playbook.sh -i "$INV" $APPS playbooks/postgres.yml 2>&1 | tee rotate.log | tee -a all.log
          grep -q 'Password set from its secret: demo_rw"' rotate.log || { echo "::error::the password of demo_rw was not set"; exit 1; }
          tests/lifecycle/check-postgres-apps.sh password demo_rw
          tests/lifecycle/playbook.sh -i "$INV" $APPS playbooks/postgres.yml 2>&1 | tee second.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second.log || { echo "::error::the apply after the rotation changed something"; exit 1; }

      # Changes and removals by the inventory (docs/POSTGRES.md, section 7). This job has no
      # backup service: dropping a database must be refused here; the backup job drops one.
      - name: A connected user is not dropped; once disconnected it is, with its secret and network
        env:
          C: tests/lifecycle/check-postgres-apps.sh
          STEP: -e @tests/lifecycle/apps-step2.yml
        run: |
          image=$(tests/lifecycle/as-svc.sh podman inspect dev-pg-main --format '{{.ImageName}}')
          # An idle connection, as an application keeps: psql waits on its input. (A running
          # query would outlive the stop: PostgreSQL only notices when it ends.)
          tests/lifecycle/as-svc.sh podman run -d --rm --name lifecycle-session --network dev-ai-pg-main-net \
            --secret dev-demo-ai-db-password,type=env,target=PGPASSWORD --entrypoint sh "$image" \
            -c 'sleep 300 | psql -X -h dev-pg-main -U demo_ai -d demo' >/dev/null
          sleep 3
          if tests/lifecycle/playbook.sh -i "$INV" $STEP playbooks/postgres.yml > drop.log 2>&1; then
            echo "::error::demo_ai was dropped while connected"; exit 1
          fi
          cat drop.log >> all.log
          grep -q 'Still connected to what would be dropped' drop.log || { echo "::error::unexpected refusal"; exit 1; }
          $C role demo_ai present
          tests/lifecycle/as-svc.sh podman stop -t 0 lifecycle-session >/dev/null
          tests/lifecycle/playbook.sh -i "$INV" $STEP playbooks/postgres.yml 2>&1 | tee drop.log | tee -a all.log
          grep -q 'KeePassXC entries: ci-site/demo-ai-db-password' drop.log || { echo "::error::no reminder"; exit 1; }
          $C role demo_ai absent
          $C secret dev-demo-ai-db-password absent
          $C net dev-ai-pg-main-net absent
          $C groups demo_ro demo2_reader,demo_reader
          $C role demo_reader present
          tests/lifecycle/playbook.sh -i "$INV" $STEP playbooks/postgres.yml 2>&1 | tee second.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second.log || { echo "::error::the second apply changed something"; exit 1; }

      - name: A user removed from one database but kept in another is not dropped
        env:
          C: tests/lifecycle/check-postgres-apps.sh
          STEP: -e @tests/lifecycle/apps-step3.yml
        run: |
          tests/lifecycle/playbook.sh -i "$INV" $STEP playbooks/postgres.yml 2>&1 | tee -a all.log
          $C role demo_ro present
          $C groups demo_ro demo2_reader
          $C secret dev-demo-ro-db-password present
          # A database declared without users (apps-step3.yml) is created with its groups.
          $C db demo3 present
          $C role demo3_owner present
          tests/lifecycle/playbook.sh -i "$INV" $STEP playbooks/postgres.yml 2>&1 | tee second.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second.log || { echo "::error::the second apply changed something"; exit 1; }

      - name: A database is not dropped without a backup service, nor all of them without confirmation
        env:
          C: tests/lifecycle/check-postgres-apps.sh
        run: |
          if tests/lifecycle/playbook.sh -i "$INV" -e @tests/lifecycle/apps-step4.yml playbooks/postgres.yml > drop.log 2>&1; then
            echo "::error::demo2 was dropped without a backup"; exit 1
          fi
          cat drop.log >> all.log
          grep -q 'there is no backup service on' drop.log || { echo "::error::unexpected refusal"; exit 1; }
          $C db demo2 present
          if tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml > drop.log 2>&1; then
            echo "::error::every database went without confirmation"; exit 1
          fi
          cat drop.log >> all.log
          grep -q -- '--confirm-drop main' drop.log || { echo "::error::unexpected refusal"; exit 1; }
          $C db demo present

      - name: What was made by hand is only reported
        env:
          C: tests/lifecycle/check-postgres-apps.sh
        run: |
          tests/lifecycle/as-svc.sh podman exec dev-pg-main psql -X -U ci_admin -d postgres -v ON_ERROR_STOP=1 -q \
            -c "CREATE DATABASE handmade" -c "CREATE ROLE handmade_user" </dev/null
          tests/lifecycle/playbook.sh -i "$INV" -e @tests/lifecycle/apps-step3.yml playbooks/postgres.yml 2>&1 | tee hand.log | tee -a all.log
          grep 'left as it is:' hand.log | grep -q 'db handmade' || { echo "::error::db handmade not reported"; exit 1; }
          grep 'left as it is:' hand.log | grep -q 'role handmade_user' || { echo "::error::role handmade_user not reported"; exit 1; }
          $C db handmade present
          $C role handmade_user present

      # deploy.sh apply postgres --retire main (docs/POSTGRES.md, section 7): only a
      # declared instance; stops it and keeps its volume.
      - name: Retire the instance, keeping the volume (SPEC 4.2)
        run: |
          if tests/lifecycle/playbook.sh -i "$INV" -e @tests/lifecycle/apps-step3.yml -e postgres_retire=nope \
               playbooks/postgres.yml > retire.log 2>&1; then
            echo "::error::an undeclared instance was accepted"; exit 1
          fi
          cat retire.log >> all.log
          grep -q 'there is no instance nope in the' retire.log || { echo "::error::unexpected refusal"; exit 1; }
          tests/lifecycle/playbook.sh -i "$INV" -e @tests/lifecycle/apps-step3.yml -e postgres_retire=main \
            playbooks/postgres.yml 2>&1 | tee -a all.log
          tests/lifecycle/check-postgres.sh destroyed

      - name: Deploy again on the kept volume
        run: |
          tests/lifecycle/playbook.sh -i "$INV" -e @tests/lifecycle/apps-step3.yml playbooks/postgres.yml 2>&1 | tee -a all.log
          tests/lifecycle/check-postgres.sh read

      - name: The password never appears in the output (SPEC 4.5)
        run: |
          if grep -qF -f "$RUNNER_TEMP/pw" all.log; then echo "::error::the password appears in the Ansible output"; exit 1; fi
          echo "ok"

      - name: Diagnose
        if: failure()
        run: tests/lifecycle/diagnose.sh

  firefly:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      INV: tests/lifecycle/inventory.yml
      PG: -e @tests/lifecycle/firefly-vars.yml
      CHECK: tests/lifecycle/check-firefly.sh
      AS: tests/lifecycle/as-svc.sh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Same reason as in the base job.
      - name: Make the runner look like a normal server
        run: sudo sed -i '/^XDG_/d' /etc/environment

      # desktop-file-utils: desktop-file-validate, the freedesktop.org checker of the
      # launcher (R47). Only on the runner.
      - name: Install Podman 4.9 from Ubuntu 24.04, and desktop-file-utils
        run: |
          sudo apt-get update -qq
          # Retries: the runner's mirror sometimes fails to resolve for a while.
          sudo apt-get install -y -qq -o Acquire::Retries=5 podman desktop-file-utils
          podman --version | grep -Eq ' 4\.9\.' || { echo "Expected Podman 4.9"; exit 1; }

      - name: Install pinned ansible-core
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --requirement scripts/requirements-lint.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Random, thrown away with the runner. Never KeePassXC (SPEC 5.4).
      - name: Service user, and PostgreSQL with one database per Firefly instance
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/base.yml > base.log
          for s in superuser ff_casa ff_canary ff_ro demo_app; do
            v=$(openssl rand -hex 24)
            echo "::add-mask::$v"
            echo "$v" >> "$RUNNER_TEMP/pw"
            name=dev-${s//_/-}-db-password
            [[ $s == superuser ]] && name=dev-pg-main-superuser-password
            printf '%s' "$v" | $AS podman secret create "$name" -
          done
          tests/lifecycle/playbook.sh -i "$INV" $PG playbooks/postgres.yml 2>&1 | tee -a all.log

      - name: Repeated names or addresses are refused
        run: |
          printf 'firefly_instances:\n' > dup.yml
          printf '  - {name: %s, inbound: {publish: ["127.0.0.1:18100:8080"]}}\n' a b >> dup.yml
          if ansible-playbook -i "$INV" -e @dup.yml playbooks/firefly.yml --check > refusal.log 2>&1; then
            echo "::error::two instances with the same address and port were accepted"; exit 1
          fi
          grep -q 'repeated on the same machine' refusal.log || { cat refusal.log; echo "::error::unexpected refusal"; exit 1; }

      - name: A launcher command that would need quoting is refused
        run: |
          printf 'firefly_instances: [{name: a, inbound: {publish: ["127.0.0.1:18100:8080"]}, launcher_command: ["firefox; rm"]}]\n' > bad.yml
          if ansible-playbook -i "$INV" -e @bad.yml playbooks/firefly.yml --check > refusal.log 2>&1; then
            echo "::error::a launcher command with a space and ; was accepted"; exit 1
          fi
          grep -q 'launcher_command a list of words' refusal.log || { cat refusal.log; echo "::error::unexpected refusal"; exit 1; }

      # Only the instance is written: a whole name would end up as dev-ff-dev-ff-casa (R49).
      - name: A whole name instead of the instance is refused
        run: |
          printf 'firefly_instances: [{name: dev-ff-casa, inbound: {publish: ["127.0.0.1:18100:8080"]}}]\n' > whole.yml
          if ansible-playbook -i "$INV" -e @whole.yml playbooks/firefly.yml --check > refusal.log 2>&1; then
            echo "::error::a name with hyphens was accepted"; exit 1
          fi
          grep -q 'name ^\[a-z0-9\]{1,14}\$' refusal.log || { cat refusal.log; echo "::error::unexpected refusal"; exit 1; }

      - name: Plan before the application keys exist, expecting a clear refusal
        run: |
          if ansible-playbook -i "$INV" playbooks/firefly.yml --check > refusal.log 2>&1; then
            echo "::error::firefly ran without its application key"; exit 1
          fi
          grep -q 'Missing Podman secrets on localhost: dev-ff-casa-app-key' refusal.log \
            || { cat refusal.log; echo "::error::unexpected refusal"; exit 1; }

      - name: An application key that is not 32 characters is refused
        run: |
          printf '%s' "$(openssl rand -hex 8)" | $AS podman secret create dev-ff-casa-app-key -
          if ansible-playbook -i "$INV" playbooks/firefly.yml --check > refusal.log 2>&1; then
            echo "::error::firefly accepted a key of 16 characters"; exit 1
          fi
          grep -q 'has 16 characters' refusal.log || { cat refusal.log; echo "::error::unexpected refusal"; exit 1; }
          $AS podman secret rm dev-ff-casa-app-key >/dev/null

      - name: Create the application keys with random values
        run: |
          for i in casa canary; do
            v=$(openssl rand -hex 16)
            echo "::add-mask::$v"
            echo "$v" >> "$RUNNER_TEMP/pw"
            printf '%s' "$v" | $AS podman secret create "dev-ff-$i-app-key" -
          done

      - name: Plan, apply, apply again (zero changes), plan again (zero changes)
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/firefly.yml --check --diff 2>&1 | tee -a all.log
          tests/lifecycle/playbook.sh -i "$INV" playbooks/firefly.yml --diff 2>&1 | tee -a all.log
          tests/lifecycle/playbook.sh -i "$INV" playbooks/firefly.yml 2>&1 | tee second.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second.log || { echo "::error::the second apply changed something"; exit 1; }
          tests/lifecycle/playbook.sh -i "$INV" playbooks/firefly.yml --check 2>&1 | tee plan.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' plan.log || { echo "::error::the plan after apply shows changes"; exit 1; }

      - name: Both running, healthy, each only on its port of 127.0.0.1
        run: |
          $CHECK running casa
          $CHECK running canary

      - name: Hardened, each with its limits, its one network, its database and its secrets as files
        run: |
          $CHECK standard casa
          $CHECK standard canary

      - name: Each one's tables in the schema of its own database, owned by its _owner
        run: |
          $CHECK schema casa
          $CHECK schema canary

      - name: ff_casa_reader reads and cannot change anything, nor reach canary (phases 4 and 5)
        run: $CHECK reader

      - name: No way out (internet, host, another application, the other instance)
        run: |
          $CHECK isolation casa
          $CHECK isolation canary

      # Firefly's cron refuses to run without an owner: the first user, as the operator creates it.
      - name: The first user, through the registration page, without internet
        run: $CHECK user casa

      - name: The scheduled tasks run
        run: $CHECK cron casa

      - name: One launcher per instance in the operator's menu (R47), each with its browser
        run: |
          $CHECK launcher casa
          $CHECK launcher canary

      - name: "Manual: deployed and healthy (docs/OPERATIONS.md, 1 and 4)"
        run: tests/lifecycle/check-operations.sh firefly

      - name: Only starts with PostgreSQL healthy, within its timeout (SPEC 4.3)
        run: |
          $CHECK marker casa write
          $CHECK wait casa
          $CHECK running casa
          $CHECK running canary

      - name: An instance removed from the inventory is only reported, never stopped
        run: |
          tests/lifecycle/playbook.sh -i "$INV" -e @tests/lifecycle/firefly-only-casa.yml playbooks/firefly.yml 2>&1 \
            | tee undeclared.log | tee -a all.log
          grep 'left running as they are' undeclared.log | grep -q 'ff-canary' || { echo "::error::canary not reported"; exit 1; }
          $CHECK running canary

      - name: Retire one instance; the other keeps running (R48)
        run: |
          tests/lifecycle/playbook.sh -i "$INV" -e firefly_retire=canary playbooks/firefly.yml 2>&1 | tee -a all.log
          $CHECK destroyed canary
          $CHECK running casa
          $CHECK marker casa read

      - name: Remove all, keeping the databases and the attachments (SPEC 4.2)
        run: |
          tests/lifecycle/playbook.sh -i "$INV" -e firefly_state=absent playbooks/firefly.yml 2>&1 | tee -a all.log
          $CHECK destroyed casa
          $CHECK destroyed canary

      - name: Deploy again on the kept data
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/firefly.yml 2>&1 | tee -a all.log
          $CHECK running casa
          $CHECK running canary
          $CHECK marker casa read

      - name: The secrets never appear in the output or the journal (SPEC 4.5)
        run: |
          if grep -qF -f "$RUNNER_TEMP/pw" all.log; then echo "::error::a secret appears in the Ansible output"; exit 1; fi
          if sudo journalctl --no-pager | grep -qF -f "$RUNNER_TEMP/pw"; then echo "::error::a secret appears in the journal"; exit 1; fi
          echo "ok"

      - name: Diagnose
        if: failure()
        run: |
          tests/lifecycle/diagnose.sh
          for i in casa canary; do tests/lifecycle/as-svc.sh podman logs --tail 30 "dev-ff-$i" 2>&1 | sed "s/^/firefly-$i: /" || true; done

  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INV: tests/lifecycle/inventory.yml
      CHECK: tests/lifecycle/check-backup.sh
      AS: tests/lifecycle/as-svc.sh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Same reason as in the base job.
      - name: Make the runner look like a normal server
        run: sudo sed -i '/^XDG_/d' /etc/environment

      - name: Install Podman 4.9 from Ubuntu 24.04
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman --version | grep -Eq ' 4\.9\.' || { echo "Expected Podman 4.9"; exit 1; }

      - name: Install pinned ansible-core
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --requirement scripts/requirements-lint.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Service user and PostgreSQL
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/base.yml > base.log
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          echo "$pw" > "$RUNNER_TEMP/pw"
          printf '%s' "$pw" | $AS podman secret create dev-pg-main-superuser-password -
          tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml 2>&1 | tee -a all.log

      - name: Some data to back up
        run: |
          $AS podman exec dev-pg-main psql -X -U ci_admin -d postgres -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE lifecycle_app"
          $AS podman exec dev-pg-main psql -X -U ci_admin -d lifecycle_app -v ON_ERROR_STOP=1 -q \
            -c "CREATE SCHEMA app; CREATE TABLE app.t (n int); INSERT INTO app.t SELECT generate_series(1, 1000)"

      - name: Plan before the secret exists, expecting a clear refusal
        run: |
          if ansible-playbook -i "$INV" playbooks/backup.yml --check > refusal.log 2>&1; then
            echo "::error::backup ran without its secret"; exit 1
          fi
          grep -q 'deploy.sh secrets' refusal.log || { cat refusal.log; echo "::error::unexpected refusal"; exit 1; }

      # Random, thrown away with the runner. Never KeePassXC (SPEC 5.4).
      - name: Create the restic secret with a random value
        run: |
          rpw=$(openssl rand -hex 24)
          echo "::add-mask::$rpw"
          echo "$rpw" > "$RUNNER_TEMP/rpw"
          printf '%s' "$rpw" | $AS podman secret create dev-backup-restic-password -

      - name: Plan, apply, apply again (zero changes), plan again (zero changes)
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup.yml --check --diff 2>&1 | tee -a all.log
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup.yml --diff 2>&1 | tee -a all.log
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup.yml 2>&1 | tee second.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second.log || { echo "::error::the second apply changed something"; exit 1; }
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup.yml --check 2>&1 | tee plan.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' plan.log || { echo "::error::the plan after apply shows changes"; exit 1; }

      - name: Installed, timer on, nothing run yet
        run: $CHECK installed

      # What deploy.sh does on the laptop after a successful run.
      - name: A copy of the data repository, as deploy.sh leaves it
        run: |
          git init -q "$RUNNER_TEMP/data"
          git -C "$RUNNER_TEMP/data" -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m "lifecycle data"
          git -C "$RUNNER_TEMP/data" bundle create --quiet /var/lib/infra-podman/data-repo/infra-podman-data.bundle --all
          chmod 0640 /var/lib/infra-podman/data-repo/infra-podman-data.bundle
          ls -la /var/lib/infra-podman/data-repo

      - name: Run the backup and restore from it
        run: |
          $AS systemctl --user start dev-backup.service
          $CHECK ok

      - name: A second run adds snapshots and keeps working
        run: |
          before=$($CHECK latest)
          $AS systemctl --user start dev-backup.service
          [[ $($CHECK latest) > $before ]] || { echo "::error::the second run saved nothing"; exit 1; }
          $CHECK ok

      - name: A failed run is recorded with its reason
        run: |
          $AS systemctl --user stop dev-pg-main.service
          if $AS systemctl --user start dev-backup.service; then echo "::error::backup succeeded without PostgreSQL"; exit 1; fi
          $CHECK failed "dev-pg-main no está en marcha"
          $AS systemctl --user start dev-pg-main.service
          for _ in $(seq 1 30); do $AS podman healthcheck run dev-pg-main && break; sleep 3; done

      - name: Retention keeps 7 daily, 12 monthly and 5 yearly (R28)
        run: $CHECK retention

      - name: A new PostgreSQL image is backed up first (D11)
        run: |
          restic=$(sed -n 's/^restic_image: *"\([^"]*\)".*/\1/p' playbooks/group_vars/all/images.yml)
          # Any other image will do: this one cannot run PostgreSQL, so the deploy then
          # fails its healthcheck and is stopped, without touching the data (D11).
          if tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml -e "postgres_image=$restic" \
            -e quadlet_deploy_health_retries=2 > image.log 2>&1; then
            echo "::error::PostgreSQL ran on the restic image"; exit 1
          fi
          cat image.log >> all.log
          grep -A1 'Run the backup now' image.log | grep -q '^changed:' || { echo "::error::no backup before the image change"; exit 1; }
          $CHECK kept pre-upgrade
          tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml 2>&1 | tee -a all.log
          # The daily run that follows, the same day, must not remove it.
          $AS systemctl --user start dev-backup.service
          $CHECK kept pre-upgrade
          $CHECK kept daily
          $AS podman exec dev-pg-main psql -X -U ci_admin -d lifecycle_app -tAq -c "SELECT count(*) FROM app.t" | grep -qx 1000 \
            || { echo "::error::the data did not survive"; exit 1; }

      # docs/POSTGRES.md, section 7: removing a database from the inventory backs it up
      # first, then drops it with its groups, users, secrets and networks.
      - name: A database removed from the inventory is backed up, then dropped
        env:
          C: tests/lifecycle/check-postgres-apps.sh
        run: |
          for user in demo_app demo_rw demo_ro demo_ai; do
            v=$(openssl rand -hex 24)
            echo "::add-mask::$v"
            echo "$v" >> "$RUNNER_TEMP/pw"
            printf '%s' "$v" | $AS podman secret create "dev-${user//_/-}-db-password" -
          done
          tests/lifecycle/playbook.sh -i "$INV" -e @tests/lifecycle/apps-vars.yml playbooks/postgres.yml 2>&1 | tee -a all.log
          $C db demo present
          if tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml > drop.log 2>&1; then
            echo "::error::every database went without confirmation"; exit 1
          fi
          cat drop.log >> all.log
          grep -q -- '--confirm-drop main' drop.log || { echo "::error::unexpected refusal"; exit 1; }
          tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml -e postgres_confirm_drop=main 2>&1 | tee drop.log | tee -a all.log
          grep -A1 'Run the backup now' drop.log | grep -q '^changed:' || { echo "::error::no backup before dropping"; exit 1; }
          $CHECK kept pre-drop demo
          $C db demo absent
          for role in demo_owner demo_writer demo_reader demo_app demo_rw demo_ro demo_ai; do $C role "$role" absent; done
          for user in demo_app demo_rw demo_ro demo_ai; do $C secret "dev-${user//_/-}-db-password" absent; done
          $C net dev-demo-pg-main-net absent
          $C net dev-ai-pg-main-net absent
          [[ $($AS podman inspect dev-pg-main --format '{{.HostConfig.NetworkMode}}') == none ]] \
            || { echo "::error::dev-pg-main is not back on Network=none"; exit 1; }
          grep 'left as it is:' drop.log | grep -q 'db lifecycle_app' || { echo "::error::lifecycle_app not reported"; exit 1; }
          $C db lifecycle_app present
          tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml 2>&1 | tee second.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second.log || { echo "::error::the second apply changed something"; exit 1; }

      - name: Remove the backup, keeping the repository (SPEC 4.2)
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup.yml -e backup_state=absent 2>&1 | tee -a all.log
          $CHECK destroyed

      - name: The passwords never appear in the output or the journal (SPEC 4.5)
        run: |
          sudo journalctl _UID="$(id -u svc_runner)" --no-pager > journal.log
          for f in pw rpw; do
            if grep -qF -f "$RUNNER_TEMP/$f" all.log journal.log; then echo "::error::a password appears in the logs"; exit 1; fi
          done
          echo "ok"

      - name: Diagnose
        if: failure()
        run: |
          tests/lifecycle/diagnose.sh
          out=$(sudo journalctl _SYSTEMD_USER_UNIT=dev-backup.service --no-pager -n 30 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::warning title=backup journal::$out"

  # Phase 1e2 (R44): the server for the copy of the backups and the hourly copy, with
  # server and client on the same runner, as in DEV. Tailscale is not tested here.
  backup-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INV: tests/lifecycle/inventory.yml
      COPY: -e @tests/lifecycle/copy-vars.yml
      CHECK: tests/lifecycle/check-backup-copy.sh
      OPS: tests/lifecycle/check-operations.sh
      AS: tests/lifecycle/as-svc.sh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Same reason as in the base job.
      - name: Make the runner look like a normal server
        run: sudo sed -i '/^XDG_/d' /etc/environment

      - name: Install Podman 4.9 from Ubuntu 24.04
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman --version | grep -Eq ' 4\.9\.' || { echo "Expected Podman 4.9"; exit 1; }

      - name: Install pinned ansible-core
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --requirement scripts/requirements-lint.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Random, thrown away with the runner. Never KeePassXC (SPEC 5.4).
      - name: Service user, PostgreSQL with some data, and the random secrets
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/base.yml > base.log
          for f in pw rpw spw; do
            v=$(openssl rand -hex 24)
            echo "::add-mask::$v"
            echo "$v" > "$RUNNER_TEMP/$f"
          done
          tr -d '\n' < "$RUNNER_TEMP/pw" | $AS podman secret create dev-pg-main-superuser-password -
          tr -d '\n' < "$RUNNER_TEMP/rpw" | $AS podman secret create dev-backup-restic-password -
          tests/lifecycle/playbook.sh -i "$INV" playbooks/postgres.yml 2>&1 | tee -a all.log
          $AS podman exec dev-pg-main psql -X -U ci_admin -d postgres -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE lifecycle_app"
          $AS podman exec dev-pg-main psql -X -U ci_admin -d lifecycle_app -v ON_ERROR_STOP=1 -q \
            -c "CREATE SCHEMA app; CREATE TABLE app.t (n int); INSERT INTO app.t SELECT generate_series(1, 1000)"

      - name: Server plan before its secret exists, expecting a clear refusal
        run: |
          if ansible-playbook -i "$INV" playbooks/backup-server.yml --check > refusal.log 2>&1; then
            echo "::error::the backup server ran without its secret"; exit 1
          fi
          grep -q 'deploy.sh secrets' refusal.log || { cat refusal.log; echo "::error::unexpected refusal"; exit 1; }
          tr -d '\n' < "$RUNNER_TEMP/spw" | $AS podman secret create dev-backup-server-password -

      - name: Server plan, apply, apply again (zero changes), plan again (zero changes)
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup-server.yml --check --diff 2>&1 | tee -a all.log
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup-server.yml --diff 2>&1 | tee -a all.log
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup-server.yml 2>&1 | tee second.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second.log || { echo "::error::the second server apply changed something"; exit 1; }
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup-server.yml --check 2>&1 | tee plan.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' plan.log || { echo "::error::the server plan after apply shows changes"; exit 1; }

      - name: Server running, only on 127.0.0.1, append-only, with a password
        run: $CHECK server

      - name: Client with the copy, plan, apply, apply again (zero changes), plan again (zero changes)
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup.yml $COPY --check --diff 2>&1 | tee -a all.log
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup.yml $COPY --diff 2>&1 | tee -a all.log
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup.yml $COPY 2>&1 | tee second.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second.log || { echo "::error::the second client apply changed something"; exit 1; }
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup.yml $COPY --check 2>&1 | tee plan.log | tee -a all.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' plan.log || { echo "::error::the client plan after apply shows changes"; exit 1; }

      - name: Copy timer on, nothing run yet
        run: $CHECK installed

      # What deploy.sh does on the laptop after a successful run.
      - name: A copy of the data repository, as deploy.sh leaves it
        run: |
          git init -q "$RUNNER_TEMP/data"
          git -C "$RUNNER_TEMP/data" -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m "lifecycle data"
          git -C "$RUNNER_TEMP/data" bundle create --quiet /var/lib/infra-podman/data-repo/infra-podman-data.bundle --all
          chmod 0640 /var/lib/infra-podman/data-repo/infra-podman-data.bundle

      - name: Back up, copy to the server and restore from its volume
        run: |
          $AS systemctl --user start dev-backup.service
          $AS systemctl --user start dev-backup-copy.service
          $CHECK ok

      - name: A second copy with nothing new changes nothing
        run: |
          before=$($CHECK count)
          $AS systemctl --user start dev-backup-copy.service
          [[ $($CHECK count) == "$before" ]] || { echo "::error::a copy with nothing new added snapshots"; exit 1; }
          $CHECK ok

      - name: A new backup reaches the server on the next copy
        run: |
          before=$($CHECK count)
          $AS systemctl --user start dev-backup.service
          $AS systemctl --user start dev-backup-copy.service
          [[ $($CHECK count) -gt $before ]] || { echo "::error::the new backup did not reach the server"; exit 1; }
          $CHECK ok

      - name: The client cannot delete anything on the server (append-only)
        run: $CHECK append-only

      - name: A server that does not answer is not a failure
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup.yml $COPY -e backup_remote_url=http://127.0.0.1:9 2>&1 | tee -a all.log
          $AS systemctl --user start dev-backup-copy.service || { echo "::error::an unreachable server failed the copy service"; exit 1; }
          $CHECK unreachable
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup.yml $COPY 2>&1 | tee -a all.log

      - name: A full server fails the copy with a clear message
        run: |
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup-server.yml -e backup_server_max_size_gb=0.00001 2>&1 | tee -a all.log
          $AS systemctl --user start dev-backup.service
          if $AS systemctl --user start dev-backup-copy.service; then echo "::error::the copy succeeded on a full server"; exit 1; fi
          $CHECK failed "está lleno"
          tests/lifecycle/playbook.sh -i "$INV" playbooks/backup-server.yml 2>&1 | tee -a all.log
          $AS systemctl --user start dev-backup-copy.service
          $CHECK ok

      # docs/OPERATIONS.md, run block by block exactly as written (in DEV terms).
      - name: "Manual: what is deployed, backup status, run now, healthy (1-4)"
        run: |
          for s in deployed status run-now healthy; do $OPS $s 2>&1 | tee -a all.log; done

      - name: "Manual: restore from the local copy, check, swap (5.1)"
        run: $OPS restore-local 2>&1 | tee -a all.log

      - name: "Manual: restore from the main server's volume, without its server (5.2)"
        run: $OPS restore-server 2>&1 | tee -a all.log

      - name: "Manual: the data repository, from the local copy and as on a new laptop (5.3, 5.4)"
        run: |
          $OPS data-repo 2>&1 | tee -a all.log
          $OPS lost-laptop 2>&1 | tee -a all.log

      # As the operator does it: as data of the machine in the inventory, not as -e.
      - name: Remove the server, keeping the copies (SPEC 4.2)
        run: |
          tests/lifecycle/playbook.sh -i "$INV" -i tests/lifecycle/remove-server.yml playbooks/backup-server.yml 2>&1 | tee -a all.log
          $CHECK destroyed

      - name: The passwords never appear in the output or the journal (SPEC 4.5)
        run: |
          sudo journalctl _UID="$(id -u svc_runner)" --no-pager > journal.log
          for f in pw rpw spw; do
            if grep -qF -f "$RUNNER_TEMP/$f" all.log journal.log; then echo "::error::a password ($f) appears in the logs"; exit 1; fi
          done
          echo "ok"

      - name: Diagnose
        if: failure()
        run: |
          tests/lifecycle/diagnose.sh
          # Without podman's own event lines, which fill the annotation.
          for u in dev-backup-server dev-backup-copy dev-backup; do
            out=$(sudo journalctl _SYSTEMD_USER_UNIT=$u.service --no-pager -o cat | grep -v -e '^[0-9-]* [0-9:.]* +0000 UTC' \
              | tail -40 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::warning title=$u journal::${out:-<empty>}"
          done
          out=$(sed -e 's/%/%25/g' /var/lib/infra-podman/backup-status/dev-backup-copy.status 2>&1 | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::warning title=copy status::${out:-<empty>}"
