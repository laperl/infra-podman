---
# The applications deployed by instances, each with its short name (docs/NAMING.md,
# section 2): an instance of <role>_instances is <short>-<name> everywhere, in labels,
# networks, secrets and networking.connects_to. A new application adds its line
# (docs/services/ADD_APP.md); tests/unit/test_app_contract.py requires it.
infra_apps:
  postgres: pg
  firefly: ff
  pgadmin: pgadmin
  firefly_importer: ffimport

# The applications that administer PostgreSQL (R37): the postgres role lets its superuser
# in over TCP, to every database, only from the network of each pair with an instance of
# these. A fixed exception: tests/unit/test_app_contract.py allows only pgadmin.
infra_postgres_admins: [pgadmin]
