---
# Every container image the platform runs, in ONE place (D6). Pinned by the digest of
# the index (manifest list), never by tag. Ansible loads this file for every playbook
# in playbooks/, in dev and prod.
#
# Each line is "<name>_image: <repository>@sha256:<digest>  # track: <tag>". The tag in
# the comment is only where to look for updates: scripts/image-updates.sh, weekly in the
# image-updates workflow. A version (0.19.1) looks for a higher one; any other tag (pg18)
# for a new digest.
# To update: change the digest in a PR; CI and lifecycle test it; then tag and apply.

# PostgreSQL 18 with the pgvector extension (R27). linux/amd64 and linux/arm64.
# 2026-10-31: PG_VERSION 18.6-1.pgdg12+2 (Debian 12), the same PostgreSQL as postgres:18.
postgres_image: "docker.io/pgvector/pgvector@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47"  # track: pg18

# restic, for the backups (R19, SPEC 4.11). linux/amd64 and linux/arm64, checked by the
# operator on 2026-11-03 (ROADMAP). Alpine based: the backup runs a shell script inside.
restic_image: "docker.io/restic/restic@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510"  # track: 0.19.1

# restic's rest-server, the copy of the backups on the GX10 (R19, R44). linux/amd64 and
# linux/arm64, checked by the operator on 2026-11-03 (ROADMAP). Alpine based, with htpasswd.
rest_server_image: "docker.io/restic/rest-server@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5"  # track: 0.14.0
