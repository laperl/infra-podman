---
# Every container image the platform runs, in ONE place (D6). Pinned by the digest of
# the index (manifest list), never by tag. Ansible loads this file for every playbook
# in playbooks/, in dev and prod.
#
# Each line is "<name>_image: <repository>@sha256:<digest>  # track: <tag>". The tag in
# the comment is only where to look for updates: scripts/image-updates.sh, weekly in the
# image-updates workflow. A version (0.19.1, v1.2.3, version-6.7.9: an optional prefix of
# letters and hyphens, then numbers) looks for a higher one with the same prefix and
# shape; any other tag (pg18) for a new digest. Track an exact version, not one that
# moves (version-6.7 changes with every patch).
# To update: change the digest in a PR; CI and lifecycle test it; then tag and apply.

# PostgreSQL 18 with the pgvector extension (R27). linux/amd64 and linux/arm64.
# 2026-10-31: PG_VERSION 18.6-1.pgdg12+2 (Debian 12), the same PostgreSQL as postgres:18.
postgres_image: "docker.io/pgvector/pgvector@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47"  # track: pg18

# restic, for the backups (R19, SPEC 4.11). linux/amd64 and linux/arm64, checked by the
# operator on 2026-11-03 (ROADMAP). Alpine based: the backup runs a shell script inside.
restic_image: "docker.io/restic/restic@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510"  # track: 0.19.1

# restic's rest-server, the copy of the backups on the main server (R19, R44). linux/amd64 and
# linux/arm64, checked by the operator on 2026-11-03 (ROADMAP). Alpine based, with htpasswd.
rest_server_image: "docker.io/restic/rest-server@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5"  # track: 0.14.0

# Firefly III (phase 2, docs/services/firefly.md). Digest of the index computed by the
# operator on 2026-11-08 with skopeo inspect --raw | sha256sum. linux/amd64 and
# linux/arm64, checked by the operator the same day (plus two attestation manifests).
firefly_image: "docker.io/fireflyiii/core@sha256:d51ab6a3a7b91a5c892441578e0da7f2935f84f36bd1151fc3833acc6e060871"  # track: version-6.7.9

# pgAdmin 4 (phase 2, R37, docs/services/pgadmin.md). Digest of the index computed by the
# operator on 2026-11-18 with skopeo inspect --raw | sha256sum. linux/amd64 and linux/arm64,
# checked by the operator the same day (plus two attestation manifests). 9.19 fixes 15
# vulnerabilities of server mode (CVE-2026-116238 to CVE-2026-116252).
pgadmin_image: "docker.io/dpage/pgadmin4@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83"  # track: 9.19

# Firefly III Data Importer (phase 2, docs/services/firefly_importer.md). Digest of the index
# computed by the operator on 2026-11-18 with skopeo inspect --raw | sha256sum. linux/amd64 and
# linux/arm64, checked by the operator the same day (plus two attestation manifests). Needs
# Firefly 6.6.0 or newer. Read the release notes before updating: 2.3.1 to 2.3.3 warned of
# possible duplicate transactions.
firefly_importer_image: "docker.io/fireflyiii/data-importer@sha256:59f2f26ddf6eb55e84ce0d571259c9aabd6ddfcc23dd4d3825ab01ad79e34930"  # track: version-2.3.5
