---
# Read-only: connectivity, versions and the state of each machine. Safe in plan and apply:
# it changes nothing on the servers.
- name: Check that servers are reachable and run Podman 4.9 or newer
  hosts: servers
  gather_facts: false
  tasks:
    - name: Gather minimal facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - distribution

    - name: Read the Podman version
      ansible.builtin.command:
        cmd: podman --version
      register: check_podman
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require Podman 4.9 or newer (D5)
      ansible.builtin.assert:
        that:
          - check_podman.rc == 0
          - (check_podman.stdout | regex_search('[0-9]+\.[0-9]+(\.[0-9]+)?')) is version('4.9', '>=')
        fail_msg: "Podman 4.9 or newer is required. Found: {{ check_podman.stdout | default('podman not installed', true) }}"
        quiet: true

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }},
          {{ check_podman.stdout }}, connected as {{ ansible_facts['user_id'] | default(ansible_user | default('?')) }}

# What runs on each machine and whether it is well: services and their health, scheduled
# tasks, networks, volumes, what the backup copies and how its last run went, secrets, and
# what is left that the inventory no longer declares. Only reported: nothing is started,
# stopped or deleted (docs/OPERATIONS.md, section 4). files/machine-report.py does it, the
# same for every application: it finds them by their labels.
- name: Report the state of each machine
  hosts: servers
  gather_facts: false
  vars:
    # Short name of each role deployed by instances (docs/NAMING.md, section 2): the
    # instances of <role>_instances are <short>-<name>. A new application adds its line.
    check_shorts:
      postgres: pg
      firefly: ff
    # Every instance declared for this machine, as <short>-<name>, and the backup.
    check_declared: >-
      {%- set found = ['backup'] -%}
      {%- for role, short in check_shorts.items() -%}
      {%- for instance in hostvars[inventory_hostname][role ~ '_instances'] | default([]) -%}
      {%- set _ = found.append(short ~ '-' ~ instance.name) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ found }}
    # The Podman secrets the inventory installs on this machine (playbooks/secrets.yml).
    check_secrets: >-
      {%- set found = [] -%}
      {%- for secret in infra_secrets | default([]) | selectattr('group', 'defined') -%}
      {%- if ([secret.group] | flatten) | intersect(group_names) | length > 0 -%}
      {%- set _ = found.append(infra_env ~ '-' ~ secret.name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ found }}
  tasks:
    - name: Find the service user
      ansible.builtin.getent:
        database: passwd
        key: "{{ service_user | default('') }}"
        fail_key: false
      when: service_user is defined

    - name: Read the state of the machine
      ansible.builtin.script:
        cmd: files/machine-report.py
        executable: python3
      environment:
        HOME: "{{ ansible_facts['getent_passwd'][service_user][4] }}"
        XDG_RUNTIME_DIR: /run/user/{{ ansible_facts['getent_passwd'][service_user][1] }}
        MACHINE_REPORT_INPUT: >-
          {{ {'host': inventory_hostname, 'env': infra_env, 'declared': check_declared,
              'secrets': check_secrets} | to_json }}
      become: true
      become_user: "{{ service_user }}"
      register: check_report
      changed_when: false
      check_mode: false
      when:
        - service_user is defined
        - ansible_facts['getent_passwd'][service_user] is not none

    - name: Report
      ansible.builtin.debug:
        # Without the empty lines and terminal control sequences that the change of user
        # adds around the output on some systems.
        msg: "{{ check_report.stdout_lines | reject('search', '^$|\\x1b') }}"
      when: check_report.stdout_lines is defined
