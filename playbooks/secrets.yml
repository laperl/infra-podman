---
# Run ONLY by `deploy.sh secrets`, which hands the KeePassXC master password over stdin
# (R11). Phase 0: checks that every secret declared in infra_secrets can be read from
# KeePassXC. Creating and rotating Podman secrets on the servers arrives in phase 1.
- name: Check the secrets declared for this environment
  hosts: control
  gather_facts: false
  vars:
    secrets_rotate: ""
  tasks:
    - name: Refuse to rotate a secret that is not declared
      ansible.builtin.assert:
        that: secrets_rotate == "" or secrets_rotate in infra_secrets
        fail_msg: "'{{ secrets_rotate }}' is not in infra_secrets for {{ infra_env }}"
        quiet: true

    # The lookup sits in the task arguments, never in loop: (SPEC 4.5).
    - name: Read each declared secret from KeePassXC
      ansible.builtin.assert:
        that: lookup('kdbx', item) | length > 0
        quiet: true
      loop: "{{ infra_secrets }}"
      no_log: true

    - name: Report
      ansible.builtin.debug:
        msg: "{{ infra_secrets | length }} secret(s) readable from KeePassXC for {{ infra_env }}. Nothing is created on the servers yet (phase 1)."
