---
# Run ONLY by `deploy.sh secrets`, which hands the KeePassXC master password and the sudo
# password over stdin (R11, R29). Never through ansible-navigator.
#
# The entries live in the KeePassXC group named after the installation (infra_site in
# group_vars/all.yml of the data repository, for example laperl): <infra_site>/<name>.
# infra_secrets (inventory/<env>/group_vars/all.yml in the data repository, SPEC 4.13) lists the secrets by name:
#   - without group: only checked (read from KeePassXC), never installed (test_dummy);
#   - with group:    installed as the Podman secret <env>-<name> of the service user on
#                    every machine of that group (SPEC 4.5, 4.12).
# KeePassXC is read only for a secret that does not exist yet on the machine, or for the
# one named in --rotate. A normal run where everything exists reads nothing.

- name: Check the request and the secrets that are only read
  hosts: control
  gather_facts: false
  vars:
    secrets_rotate: ""
  tasks:
    - name: Require the name of the installation (also its KeePassXC group)
      ansible.builtin.assert:
        that: infra_site is defined and infra_site is match('^[a-z][a-z0-9-]{1,30}$')
        fail_msg: >-
          infra_site is missing or not valid in group_vars/all.yml of the data repository.
          Declare the name of the installation, for example 'infra_site: laperl' (lower case
          letters, digits and hyphens). Its secrets are read from the KeePassXC group of the
          same name (SPEC 4.5).
        quiet: true

    - name: Refuse to rotate a secret that is not declared
      ansible.builtin.assert:
        that: secrets_rotate == "" or secrets_rotate in (infra_secrets | map(attribute='name') | list)
        fail_msg: "'{{ secrets_rotate }}' is not in infra_secrets for {{ infra_env }}"
        quiet: true

    # The lookup sits in the task arguments, never in loop: (SPEC 4.5).
    - name: Read each check-only secret from KeePassXC
      ansible.builtin.assert:
        that: lookup('kdbx', item) | length > 0
        quiet: true
      loop: "{{ infra_secrets | rejectattr('group', 'defined') | map(attribute='name') | list }}"
      no_log: true

    - name: Report
      ansible.builtin.debug:
        msg: "{{ infra_secrets | rejectattr('group', 'defined') | list | length }} check-only secret(s) readable from KeePassXC for {{ infra_env }}."

- name: Install the secrets each machine needs
  hosts: servers
  become: true
  gather_facts: false
  vars:
    secrets_rotate: ""
  tasks:
    - name: Choose the secrets of this machine
      ansible.builtin.set_fact:
        secrets_here: >-
          {{ infra_secrets | selectattr('group', 'defined') | selectattr('group', 'in', group_names) | list }}

    - name: Read the service user
      ansible.builtin.getent:
        database: passwd
        key: "{{ service_user }}"
      when: secrets_here | length > 0

    - name: Set the environment of the service user
      ansible.builtin.set_fact:
        secrets_env:
          HOME: "{{ ansible_facts['getent_passwd'][service_user][4] }}"
          XDG_CONFIG_HOME: "{{ ansible_facts['getent_passwd'][service_user][4] }}/.config"
          XDG_DATA_HOME: "{{ ansible_facts['getent_passwd'][service_user][4] }}/.local/share"
          XDG_RUNTIME_DIR: /run/user/{{ ansible_facts['getent_passwd'][service_user][1] }}
      when: secrets_here | length > 0

    - name: List the Podman secrets that already exist
      ansible.builtin.command:
        cmd: podman secret ls --noheading --format {% raw %}'{{ .Name }}'{% endraw %}
      environment: "{{ secrets_env }}"
      become: true
      become_user: "{{ service_user }}"
      register: secrets_existing
      changed_when: false
      check_mode: false
      when: secrets_here | length > 0

    - name: Warn before rotating a PostgreSQL password
      ansible.builtin.debug:
        msg: >-
          Rotating {{ secrets_rotate }} only changes the Podman secret. PostgreSQL keeps the old
          password until you run ALTER ROLE first (SPEC 4.5).
      when: secrets_rotate is match('^pg-') and secrets_rotate in (secrets_here | map(attribute='name') | list)

    # The lookup sits in the task arguments, never in loop: (SPEC 4.5). With when: false
    # for a secret that exists, KeePassXC is not read.
    - name: Create the missing secrets, or rotate the one requested
      containers.podman.podman_secret:
        name: "{{ infra_env }}-{{ item.name }}"
        data: "{{ lookup('kdbx', item.name) }}"
        force: "{{ item.name == secrets_rotate }}"
        state: present
      environment: "{{ secrets_env }}"
      become: true
      become_user: "{{ service_user }}"
      loop: "{{ secrets_here }}"
      loop_control:
        label: "{{ infra_env }}-{{ item.name }}"
      when: >-
        (infra_env ~ '-' ~ item.name) not in secrets_existing.stdout_lines
        or item.name == secrets_rotate
      no_log: true

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ secrets_here | length }} secret(s) declared
          ({{ secrets_here | map(attribute='name') | join(', ') or 'none' }}).
