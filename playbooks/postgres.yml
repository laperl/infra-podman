---
# Phase 1: the PostgreSQL instances of each machine (D8). Which instances a machine runs
# is in the inventory (postgres_instances). Needs the base playbook and the secrets first.
#   ./deploy.sh plan postgres --limit laptop
# Databases and users: docs/POSTGRES.md, section 7. Dropping every database of an instance
# needs ./deploy.sh apply postgres --confirm-drop <instance>.
# Retiring an instance, keeping its data: ./deploy.sh apply postgres --retire <instance>
# (-e postgres_retire=<instance>), while it is still in the inventory. CI destroys every
# instance with -e postgres_state=absent.
- name: PostgreSQL instances
  hosts: postgres_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Check that the instance to retire is in the inventory
      ansible.builtin.assert:
        that: postgres_retire in postgres_instances | map(attribute='name')
        fail_msg: >-
          --retire {{ postgres_retire }}: there is no instance {{ postgres_retire }} in the
          inventory of {{ inventory_hostname }}. Retire it while it is still declared, and
          remove it from the inventory afterwards (docs/POSTGRES.md, section 7).
        quiet: true
      when: postgres_retire | default('') | length > 0

    # Each user has one secret per machine, <env>-<user>-db-password: the same name in two
    # instances would share it (docs/services/README.md, 3).
    - name: Check that no user name is in two instances of this machine
      ansible.builtin.assert:
        that: postgres_users_per_instance | length == postgres_users_per_instance | unique | list | length
        fail_msg: >-
          A user name is in more than one PostgreSQL instance of {{ inventory_hostname }}:
          {{ postgres_users_twice | join(', ') }}.
          Its password secret (<user>-db-password) would be shared: give it another name in one of them.
        quiet: true
      vars:
        postgres_users_twice: >-
          {%- set seen = [] -%}{%- set twice = [] -%}
          {%- for n in postgres_users_per_instance -%}
            {%- if n in seen -%}{%- set _ = twice.append(n) -%}{%- else -%}{%- set _ = seen.append(n) -%}{%- endif -%}
          {%- endfor -%}
          {{ twice | unique | list }}
        postgres_users_per_instance: >-
          {%- set out = [] -%}
          {%- for i in postgres_instances -%}
            {%- set names = [] -%}
            {%- for d in (i.databases | default([], true)) -%}
              {%- for u in (d.users | default([], true)) -%}{%- set _ = names.append(u.name) -%}{%- endfor -%}
            {%- endfor -%}
            {%- set _ = out.extend(names | unique) -%}
          {%- endfor -%}
          {{ out }}

    - name: Deploy each instance
      ansible.builtin.include_role:
        name: postgres
      loop: "{{ postgres_instances }}"
      loop_control:
        loop_var: postgres_item
        label: pg-{{ postgres_item.name }}
      vars:
        postgres_instance: "{{ postgres_item.name }}"
        # --retire <instance>: only that one is stopped (its data kept); -e postgres_state,
        # as an extra variable, still wins over this for every instance.
        postgres_state: "{{ 'absent' if postgres_item.name == postgres_retire | default('') else 'present' }}"
        # Data of the operator (docs/POSTGRES.md, section 6): required, no default.
        postgres_superuser: "{{ postgres_item.superuser | default('') }}"
        # Its application databases, groups and users (docs/POSTGRES.md, section 6).
        postgres_databases: "{{ postgres_item.databases | default([]) }}"

    # An instance removed from the inventory is never stopped or dropped by removing it
    # (docs/POSTGRES.md, section 7): only reported, on every run.
    - name: Read the service user
      ansible.builtin.getent:
        database: passwd
        key: "{{ service_user }}"

    - name: Read the PostgreSQL instances running on this machine
      ansible.builtin.command:
        argv:
          - podman
          - ps
          - --all
          - --filter
          - label=infra.component=db
          - --filter
          - label=infra.managed-by=infra-podman
          - --format
          - '{% raw %}{{ index .Labels "infra.app" }}{% endraw %}'
      environment:
        XDG_RUNTIME_DIR: /run/user/{{ ansible_facts['getent_passwd'][service_user][1] }}
      become: true
      become_user: "{{ service_user }}"
      register: postgres_found
      changed_when: false
      check_mode: false

    - name: Report instances that are not in the inventory (left as they are)
      ansible.builtin.debug:
        msg: >-
          Not in the inventory of {{ inventory_hostname }}, left running as they are:
          {{ postgres_undeclared | join(', ') }}. To retire one keeping its data, declare it
          again and run ./deploy.sh apply postgres --retire <instance> (docs/POSTGRES.md, section 7).
      when: postgres_undeclared | length > 0
      vars:
        postgres_undeclared: >-
          {{ postgres_found.stdout_lines | reject('in', postgres_instances | map(attribute='name')
             | map('regex_replace', '^', 'pg-') | list) | list }}
