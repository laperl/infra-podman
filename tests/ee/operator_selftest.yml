---
# Run by the operator on the laptop against infra-dev.kdbx created with KeePassXC 2.8
# (phase 0 done criterion). Never prints the value, only its length.
- name: Kdbx lookup reads Infra_Podman/test_dummy from infra-dev.kdbx
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the fictitious test secret
      ansible.builtin.set_fact:
        kdbx_selftest_value: "{{ lookup('kdbx', 'test_dummy') }}"
      no_log: true

    - name: Report the result without the value
      ansible.builtin.debug:
        msg: "OK: read Infra_Podman/test_dummy ({{ kdbx_selftest_value | length }} characters)"
