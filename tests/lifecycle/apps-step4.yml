---
# postgres job, after apps-step3.yml: demo2 is removed. This job has no backup service, so
# the apply must refuse to drop it. Fictitious names only.
postgres_instances:
  - name: main
    superuser: ci_admin
    databases:
      - name: demo
        users:
          - {name: demo_app, group: owner}
          - {name: demo_rw, group: writer}
firefly_instances:
  - name: demo
    networking: {inbound: {publish: ["127.0.0.1:18110:8080"]}, connects_to: [pg-main]}
    pg_hba: [{instance: pg-main, database: demo}]
