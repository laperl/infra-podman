---
# The firefly job, step "A way out only where the operator says": the two instances of
# tests/lifecycle/inventory.yml, with casa allowed out to one address of the runner (R59).
# Used with -e lifecycle_allowed=<address>.
firefly_instances:
  - name: casa
    networking:
      inbound: {publish: ["127.0.0.1:17100:8080"]}
      connects_to: [pg-main]
      egress: ["{{ lifecycle_allowed }}"]
    pg_hba: [{instance: pg-main, database: ff_casa}]
    timezone: Europe/Madrid
    start_timeout: 60
  - name: canary
    networking: {inbound: {publish: ["127.0.0.1:17101:8080"]}, connects_to: [pg-main]}
    pg_hba: [{instance: pg-main, database: ff_canary}, {instance: pg-main, database: ff_casa}]
    image: firefly_ci_image
    memory: 768m
    launcher_command: [flatpak, run, org.mozilla.firefox, --new-window]
