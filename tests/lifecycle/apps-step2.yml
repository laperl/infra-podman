---
# postgres job, after apps-vars.yml (docs/POSTGRES.md, section 7): demo_ai is removed, and
# so is the application ai, whose network goes (docs/NETWORK.md); demo_ro is also in a new
# database, demo2, which demo now names in its pg_hba. Fictitious names only.
postgres_instances:
  - name: main
    superuser: ci_admin
    databases:
      - name: demo
        users:
          - {name: demo_app, group: owner}
          - {name: demo_rw, group: writer}
          - {name: demo_ro, group: reader}
      - name: demo2
        users:
          - {name: demo_ro, group: reader}
firefly_instances:
  - name: demo
    networking: {inbound: {publish: ["127.0.0.1:18110:8080"]}, connects_to: [pg-main]}
    pg_hba: [{instance: pg-main, database: demo}, {instance: pg-main, database: demo2}]
