---
# Inventory for the lifecycle workflow: the GitHub runner itself plays the server.
# Throwaway machine, so the service user and every value here are fictitious.
all:
  vars:
    infra_env: dev
    infra_site: ci-site  # fictitious installation name (R42)
    service_user: svc_runner
  children:
    servers:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    backup_clients:
      hosts:
        localhost: {}
      vars:
        backup_data_repo: true   # the runner plays the laptop
        backup_notify: false     # no desktop session; tested in tests/backup/run.sh
    # Server for the copy of the backups (R44). The copy itself is switched on only in the
    # backup-copy job (copy-vars.yml), so the backup job keeps testing local copies alone.
    backup_servers:
      hosts:
        localhost: {}
      vars:
        backup_server_tailscale: false  # no Tailscale on the runner, as in DEV
    postgres_hosts:
      hosts:
        localhost: {}
      vars:
        postgres_instances:
          - name: main
            superuser: ci_admin  # fictitious
    # Firefly III (playbook firefly): its database and user come from firefly-vars.yml.
    firefly_hosts:
      hosts:
        localhost: {}
      vars:
        firefly_timezone: Europe/Madrid   # any valid zone; not UTC, to see it applied
        firefly_start_timeout: 60         # the wait test takes this long; prod keeps 300
