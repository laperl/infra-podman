---
# Inventory for the lifecycle workflow: the GitHub runner itself plays the server.
# Throwaway machine, so the service user and every value here are fictitious.
all:
  vars:
    infra_env: dev
    infra_site: ci-site  # fictitious installation name (R42)
    service_user: svc_runner
  children:
    servers:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    backup_clients:
      hosts:
        localhost: {}
      vars:
        backup_data_repo: true   # the runner plays the laptop
        backup_notify: false     # no desktop session; tested in tests/backup/run.sh
    postgres_hosts:
      hosts:
        localhost: {}
      vars:
        postgres_instances:
          - name: main
            superuser: ci_admin  # fictitious
