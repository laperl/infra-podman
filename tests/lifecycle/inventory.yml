---
# Inventory for the lifecycle workflow: the GitHub runner itself plays the server.
# Throwaway machine, so the service user and every value here are fictitious.
all:
  vars:
    infra_env: dev
    infra_site: ci-site  # fictitious installation name (R42)
    service_user: svc_runner
    # Who reads each secret of these jobs (roles/podman_secrets). The values are made in CI.
    infra_secrets:
      - {name: pg-main-superuser-password, group: postgres_hosts, readers: [pg-main]}
      - {name: demo-app-db-password, group: postgres_hosts, readers: [pg-main, ff-demo]}
      - {name: demo-rw-db-password, group: postgres_hosts, readers: [pg-main, ff-demo]}
      - {name: demo-ro-db-password, group: postgres_hosts, readers: [pg-main, ff-demo]}
      - {name: demo-ai-db-password, group: postgres_hosts, readers: [pg-main, ff-ai]}
      - {name: ff-ro-db-password, group: postgres_hosts, readers: [pg-main, ff-canary]}
      - {name: ff-casa-db-password, group: postgres_hosts, readers: [pg-main, ff-casa]}
      - {name: ff-canary-db-password, group: postgres_hosts, readers: [pg-main, ff-canary]}
      - {name: ff-casa-app-key, group: firefly_hosts, readers: [ff-casa]}
      - {name: ff-canary-app-key, group: firefly_hosts, readers: [ff-canary]}
      - {name: pgadmin-ci-login-password, group: pgadmin_hosts, readers: [pgadmin-ci]}
      - {name: backup-restic-password, group: backup_clients, readers: [backup]}
      - {name: backup-server-password, group: [backup_clients, backup_servers], readers: [backup, backup-server]}
  children:
    servers:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    backup_clients:
      hosts:
        localhost: {}
      vars:
        backup_data_repo: true   # the runner plays the laptop
        backup_notify: false     # no desktop session; tested in tests/backup/run.sh
    # Server for the copy of the backups (R44). The copy itself is switched on only in the
    # backup-copy job (copy-vars.yml), so the backup job keeps testing local copies alone.
    backup_servers:
      hosts:
        localhost: {}
      vars:
        # No tailscale_serve: no Tailscale on the runner, as in DEV.
        backup_server_networking: {inbound: {publish: ["127.0.0.1:18000:8000"]}}
    postgres_hosts:
      hosts:
        localhost: {}
      vars:
        postgres_instances:
          - name: main
            superuser: ci_admin  # fictitious
    # Firefly III (playbook firefly): two instances, as independent as two applications
    # (R48). Their databases and users come from firefly-vars.yml; until they are declared
    # there, PostgreSQL gives them no network (docs/NETWORK.md). canary also enters ff_casa,
    # as an application that reads another one's data would (check-firefly.sh reader).
    firefly_hosts:
      hosts:
        localhost: {}
      vars:
        # A second image variable, as a canary would have in images.yml: here the same image.
        firefly_ci_image: "{{ firefly_image }}"
        firefly_instances:
          - name: casa
            networking: {inbound: {publish: ["127.0.0.1:18100:8080"]}, connects_to: [pg-main]}
            pg_hba: [{instance: pg-main, database: ff_casa}]
            timezone: Europe/Madrid   # any valid zone; not UTC, to see it applied
            start_timeout: 60         # the wait test takes this long; the default is 300
          - name: canary
            networking: {inbound: {publish: ["127.0.0.1:18101:8080"]}, connects_to: [pg-main]}
            pg_hba: [{instance: pg-main, database: ff_canary}, {instance: pg-main, database: ff_casa}]
            image: firefly_ci_image
            memory: 768m
            launcher_command: [flatpak, run, org.mozilla.firefox, --new-window]
    # The pgadmin job declares its instance in tests/lifecycle/pgadmin-vars.yml: here none,
    # so the other jobs keep PostgreSQL without the network of pgAdmin.
    pgadmin_hosts:
      hosts:
        localhost: {}
      vars:
        pgadmin_instances: []
