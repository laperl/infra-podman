---
# Inventory for the lifecycle workflow: the GitHub runner itself plays the server.
# Throwaway machine, so the service user and every value here are fictitious.
all:
  vars:
    infra_env: dev
    infra_site: ci-site  # fictitious installation name (R42)
    service_user: svc_runner
  children:
    servers:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    backup_clients:
      hosts:
        localhost: {}
      vars:
        backup_data_repo: true   # the runner plays the laptop
        backup_notify: false     # no desktop session; tested in tests/backup/run.sh
    # Server for the copy of the backups (R44). The copy itself is switched on only in the
    # backup-copy job (copy-vars.yml), so the backup job keeps testing local copies alone.
    backup_servers:
      hosts:
        localhost: {}
      vars:
        # No tailscale_serve: no Tailscale on the runner, as in DEV.
        backup_server_inbound: {publish: ["127.0.0.1:18000:8000"]}
    postgres_hosts:
      hosts:
        localhost: {}
      vars:
        postgres_instances:
          - name: main
            superuser: ci_admin  # fictitious
    # Firefly III (playbook firefly): two instances, as independent as two applications
    # (R48). Their databases and users come from firefly-vars.yml.
    firefly_hosts:
      hosts:
        localhost: {}
      vars:
        # A second image variable, as a canary would have in images.yml: here the same image.
        firefly_ci_image: "{{ firefly_image }}"
        firefly_instances:
          - name: casa
            inbound: {publish: ["127.0.0.1:18100:8080"]}
            timezone: Europe/Madrid   # any valid zone; not UTC, to see it applied
            start_timeout: 60         # the wait test takes this long; the default is 300
          - name: canary
            inbound: {publish: ["127.0.0.1:18101:8080"]}
            image: firefly_ci_image
            memory: 768m
            launcher_command: [flatpak, run, org.mozilla.firefox, --new-window]
