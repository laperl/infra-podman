---
# The inventory of the firefly job with the instance canary removed: it must only be
# reported, never stopped (playbooks/firefly.yml).
firefly_instances:
  - name: casa
    networking: {inbound: {publish: ["127.0.0.1:17100:8080"]}, connects_to: [pg-main]}
    pg_hba: [{instance: pg-main, database: ff_casa}]
    timezone: Europe/Madrid
    start_timeout: 60
