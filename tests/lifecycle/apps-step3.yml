---
# postgres job, after apps-step2.yml: demo_ro leaves demo but stays in demo2, so it is not
# dropped. demo3 is a database without users yet (no users: key), as docs/POSTGRES.md,
# section 7, lets the operator declare it. Fictitious names only.
postgres_instances:
  - name: main
    superuser: ci_admin
    databases:
      - name: demo
        users:
          - {name: demo_app, group: owner}
          - {name: demo_rw, group: writer}
      - name: demo2
        users:
          - {name: demo_ro, group: reader}
      - name: demo3
firefly_instances:
  - name: demo
    networking: {inbound: {publish: ["127.0.0.1:17102:8080"]}, connects_to: [pg-main]}
    pg_hba: [{instance: pg-main, database: demo}, {instance: pg-main, database: demo2}]
