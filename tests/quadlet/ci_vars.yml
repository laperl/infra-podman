---
# Fictitious values used only to render templates in CI. Never real data.
infra_env: dev
infra_site: ci-site
demo_image: "ghcr.io/example/demo@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
demo_subnet: "10.89.250.0/24"
demo_port: 8080
postgres_superuser: ci_admin
# Application databases with three consumers, so the role renders its .network units,
# Firefly's among them (roles/firefly joins it).
postgres_databases:
  - name: demo
    users:
      - {name: demo_app, group: owner, consumer: demo}
      - {name: demo_ai, group: reader, consumer: ai}
  - name: firefly
    users:
      - {name: firefly, group: owner, consumer: firefly}
