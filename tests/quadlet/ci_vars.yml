---
# Fictitious values used only to render templates in CI. Never real data.
infra_env: dev
infra_site: ci-site
demo_image: "ghcr.io/example/demo@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
demo_subnet: "10.89.250.0/24"
demo_port: 8080
postgres_superuser: ci_admin
# The copy to a backup server on another machine, as in prod: the copy container gets its
# own network with a route only to this address (R59).
backup_remote_url: http://100.64.0.7:18000
# Application databases of the instance main. Who enters them is said by the applications
# (docs/NETWORK.md): Firefly's instance ci connects to pg-main and enters ff_ci, so the
# postgres role renders the network of that pair, and roles/firefly renders ci joining it.
# ci also talks to another Firefly instance, peer: the network of that pair comes from the
# common template of quadlet_deploy (pair.network.j2). demo has no application: kept, with
# no network.
postgres_databases:
  - name: demo
    users:
      - {name: demo_app, group: owner}
  - name: ff_ci
    users:
      - {name: ff_ci, group: owner}
firefly_instances:
  - name: ci
    networking: {inbound: {publish: ["127.0.0.1:18100:8080"]}, connects_to: [pg-main, ff-peer]}
    pg_hba: [{instance: pg-main, database: ff_ci}]
  - name: peer
    networking: {inbound: {publish: ["127.0.0.1:18101:8080"]}}
# pgAdmin's instance ci administers pg-main (R37): the postgres role renders the network of
# that pair, and roles/pgadmin renders ci joining it. Fictitious e-mail.
pgadmin_instances:
  - name: ci
    email: admin@example.com
    networking: {inbound: {publish: ["127.0.0.1:18102:8080"]}, connects_to: [pg-main]}
# The Data Importer's instance ci imports into Firefly ci: roles/firefly_importer renders the
# network of that pair from the common template, and roles/firefly renders ci joining it.
# With one Firefly, it gets its address and a fictitious OAuth client.
firefly_importer_instances:
  - name: ci
    networking: {inbound: {publish: ["127.0.0.1:18115:8080"]}, connects_to: [ff-ci]}
    client_id: 9

# The agent sends to a store on another machine, by its name in the Tailscale network.
obs_agent_store: obs-store.example.ts.net
obs_agent_machine: ci
