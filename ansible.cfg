[defaults]
# Paths are relative to this file.
lookup_plugins = ./plugins/lookup
roles_path = ./roles
retry_files_enabled = False
interpreter_python = auto_silent

[connection]
# Modules travel over the SSH session instead of temporary files, so becoming the
# unprivileged service user does not depend on file permission tricks (D3). Fedora and
# Ubuntu do not set sudo's requiretty, which pipelining would need disabled.
pipelining = True
