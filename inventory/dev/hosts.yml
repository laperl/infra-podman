---
# Inventory for --env dev. Host names are SSH aliases: the address, port and user
# live in the operator's ~/.ssh/config (Host devvm), not in the repository.
all:
  children:
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    servers:
      hosts:
        devvm: {}  # VM DEV (Ubuntu Server 24.04 x86_64, Podman 4.9)
