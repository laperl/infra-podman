---
# Inventory for --env prod. Host names are SSH aliases: the address, port and user
# live in the operator's ~/.ssh/config (Host gx10), not in the repository.
all:
  children:
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    servers:
      hosts:
        gx10: {}  # ASUS Ascent GX10 (DGX OS 7, Podman 4.9)
