---
# EXAMPLE (SPEC 4.13). The real file is inventory/dev/group_vars/pgadmin_hosts.yml in the
# data repository. pgAdmin 4 on each machine of pgadmin_hosts, as instances
# (docs/services/README.md); usually one, administering one or more PostgreSQL instances of
# the machine as their superuser (R37). What an instance does not say comes from
# roles/pgadmin/defaults/main.yml. Order of the applies: postgres first, then pgadmin.
pgadmin_instances:
  - name: laptop                 # ^[a-z0-9]{1,14}$
    email: admin@example.com     # its only user; yours goes only in the data repository
    networking:
      inbound:                   # where it listens: <address>:<host port>:<container port>
        publish: ["127.0.0.1:18110:8080"]   # pgAdmin listens on 8080 inside the container
      connects_to: [pg-main]     # the PostgreSQL instances it administers; no pg_hba, no egress
    # backup: [data]             # copy its volume (its user, servers and preferences)
    # log_level: 30              # 10 debug, 20 info, 30 warning, 40 error, 50 critical
    # memory: 512m               # resource limits (R46)
    # cpus: "1"
    # pids_limit: 256
    # launcher_command: [flatpak, run, org.mozilla.firefox, --new-window]   # default [xdg-open]
