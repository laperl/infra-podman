---
# EXAMPLE (SPEC 4.13). The real file is inventory/dev/group_vars/postgres_hosts.yml in
# the data repository.
#
# PostgreSQL instances on each machine of postgres_hosts (D8): dev-pg-<name>. Each one
# needs the secret pg-<name>-superuser-password in infra_secrets (group_vars/all.yml)
# and in KeePassXC.
postgres_instances:
  - name: main
    # The administrator role (docs/POSTGRES.md, section 1). Your own name, not "postgres".
    superuser: example_admin

# Application databases, groups and users (docs/POSTGRES.md, sections 2 and 6), as data.
# Names are chosen by the operator and never go into the code repository. Each user needs
# its secret pg-<instance>-<user>-password in infra_secrets (group postgres_hosts) and in
# KeePassXC. Uncomment and adapt:
#
# postgres_instances:
#   - name: main
#     superuser: example_admin
#     databases:
#       - name: app1            # database, schema and groups app1_*; ^[a-z][a-z0-9_]{0,30}$
#         users:
#           - name: app1        # unique in the instance; ^[a-z][a-z0-9_]{0,62}$
#             group: owner      # owner | writer | reader
#             consumer: app1    # the application that connects with it: its network, only from there
#           - name: app1_ai
#             group: reader
#             consumer: ai
