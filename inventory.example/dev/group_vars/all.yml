---
# EXAMPLE (SPEC 4.13). The real file is inventory/dev/group_vars/all.yml in the data
# repository. Variables for every machine of this environment.
infra_env: dev

# Name of this installation: yours, or a client's. Required, the same in dev and prod, and
# different for every installation. It is also the KeePassXC group of its secrets
# (example/<secret>). Lower case letters, digits and hyphens.
infra_site: example

# The one service user on every machine that runs services (D3).
service_user: svc_runner

# Secrets this environment expects in its KeePassXC database, under <infra_site>/<name>.
# Names only, never values (docs/SECRETS_INVENTORY.md). With group: installed by
# deploy.sh secrets as the Podman secret <env>-<name> on every machine of that group.
infra_secrets:
  - name: test_dummy  # only checked, never installed
  - name: pg-main-superuser-password
    group: postgres_hosts
  # One per application user of postgres_hosts.yml (docs/POSTGRES.md, section 4):
  # - name: pg-main-app1-password
  #   group: postgres_hosts
  # Firefly III, two per instance (docs/services/README.md): its user's password and its
  # application key (exactly 32 letters and digits). For the instance casa:
  # - name: pg-main-ff_casa-password
  #   group: postgres_hosts
  # - name: ff-casa-app-key
  #   group: firefly_hosts
  - name: backup-restic-password  # key of the restic repositories: lose it, lose the backups
    group: backup_clients
  - name: backup-server-password  # user <infra_site> of the backup server: both ends need it
    group: [backup_clients, backup_servers]

# Size limit of the backup server, in GB: the server enforces it and the clients warn at
# 80 % (R44). Here because both ends use it.
backup_server_max_size_gb: 30

# Never forward the operator's SSH agent to a server: any process there (an AI included)
# could use the operator's keys, the signing key among them (D14, R17). On the command line
# this wins over whatever ~/.ssh/config says.
ansible_ssh_common_args: "-o ForwardAgent=no"
