---
# EXAMPLE with invented names (SPEC 4.13). The real inventory lives in the operator's
# data repository, with this same layout: inventory/prod/hosts.yml.
#
# Inventory for --env prod. Host names are SSH aliases: the address, port and user
# live in the operator's ~/.ssh/config, not in any repository.
all:
  children:
    # Ansible itself, inside its container. Keep it as is.
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # Every machine that runs services: the base playbook creates the service user there.
    servers:
      hosts:
        example-laptop: {}  # the control laptop, over SSH to 127.0.0.1 (R23)
        example-server: {}  # a server (Ubuntu 24.04, Podman 4.9)
    # Machines with a daily local backup (playbook backup, SPEC 4.11).
    backup_clients:
      hosts:
        example-laptop: {}
    # Machines that keep the copy of the backups of other machines (playbook
    # backup-server, R44).
    backup_servers:
      hosts:
        example-server: {}  # the GX10: receives the copy of the backups
    # Machines with PostgreSQL instances (group_vars/postgres_hosts.yml says which).
    postgres_hosts:
      hosts:
        example-laptop: {}  # primary for personal data (R18)
    # Machines with Firefly III (playbook firefly, docs/services/firefly.md). Each one is
    # also in postgres_hosts, with Firefly's database in group_vars/postgres_hosts.yml.
    firefly_hosts:
      hosts:
        example-laptop: {}
