---
# EXAMPLE (SPEC 4.13). The real file is inventory/prod/group_vars/postgres_hosts.yml in
# the data repository.
#
# PostgreSQL instances on each machine of postgres_hosts (D8): prod-pg-<name>. Each one
# needs the secret pg-<name>-superuser-password in infra_secrets (group_vars/all.yml)
# and in KeePassXC.
postgres_instances:
  - name: main
    # The administrator role (docs/POSTGRES.md, section 1). Your own name, not "postgres".
    superuser: example_admin

# Application databases, groups and users (docs/POSTGRES.md, sections 2 and 6), as data.
# Names are chosen by the operator and never go into the code repository. Each user needs
# its secret <user>-db-password (- for _: app1_ai -> app1-ai-db-password) in infra_secrets
# (group postgres_hosts) and in
# KeePassXC. Uncomment and adapt:
#
# postgres_instances:
#   - name: main
#     superuser: example_admin
#     databases:
#       - name: app1            # database and schema app1; ^[a-z][a-z0-9_]{0,30}$
#         # Groups, always these three (docs/POSTGRES.md, section 2):
#         #   app1_owner   everything in its database: creates and changes tables
#         #   app1_writer  reads and writes rows, cannot change the structure
#         #   app1_reader  only reads
#         # Adding, changing and removing: docs/POSTGRES.md, section 7.
#         users:
#           - name: app1        # ^[a-z][a-z0-9_]{0,62}$
#             group: owner      # owner | writer | reader: joins app1_owner
#             consumer: app1    # the application that connects with it: its network, only from there
#           - name: app1_ai
#             group: reader
#             consumer: ai
#       # Firefly III: one database per instance, never shared (docs/services/README.md).
#       # The instance casa: its user in ff_casa_owner, from its own network.
#       - name: ff_casa
#         users:
#           - name: ff_casa
#             group: owner
#             consumer: ff-casa
