---
# ansible-navigator settings (SPEC D2). deploy.sh (phase 0c) runs everything through this.
ansible-navigator:
  execution-environment:
    enabled: true
    container-engine: podman
    # Pinned by digest (D6). Published by .github/workflows/ee-image.yml.
    image: ghcr.io/laperl/infra-podman-ee@sha256:fa0ec66d8e6f742e4eaf487df8be800f0682165a4d5b80c2866cb368fa0dd760  # sha-9807470
    pull:
      policy: missing
    # ansible-runner mounts ~/.ssh and the SSH agent socket without an SELinux label, so on
    # Fedora (enforcing) the container could not use them. Same choice as deploy.sh secrets.
    # Confirmed by the operator on 2026-11-02 (R16).
    # --network=host: the laptop is also a server (R18) and Ansible reaches it over SSH on
    # 127.0.0.1, where its sshd listens. From a container on Podman's own network,
    # 127.0.0.1 would be the container itself (R23).
    container-options:
      - "--security-opt=label=disable"
      - "--network=host"
  mode: stdout
  # Playbook artifacts store every task result in a JSON file on disk. Disabled so
  # nothing from a run is kept outside journald and the deploy.sh log line (SPEC 4.10).
  playbook-artifact:
    enable: false
  logging:
    level: warning
    file: ansible-navigator.log
