---
# R25: `tailscale serve --bg --tcp=<port> tcp://localhost:<port>`, as root. Only this
# port is added; whatever else `tailscale serve` already does on the machine (for example
# a web page on 443) is never changed or reset. --bg keeps it across reboots.
- name: Read what tailscale serve already does
  ansible.builtin.command:
    cmd: tailscale serve status --json
  become: true
  register: backup_server_serve
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require Tailscale
  ansible.builtin.assert:
    that: backup_server_serve.rc == 0
    fail_msg: >-
      'tailscale serve status' failed on {{ inventory_hostname }} ({{ backup_server_serve.stderr | default('') | trim }}).
      Is Tailscale installed and connected? Where there is no Tailscale (the DEV VM), set
      backup_server_tailscale: false in the data repository.
    quiet: true

# The JSON lists TCP handlers by port; a forwarder has TCPForward (host:port).
- name: Find this port in the serve configuration
  ansible.builtin.set_fact:
    backup_server_serve_port: >-
      {{ (((backup_server_serve.stdout | default('', true) | trim or '{}') | from_json).get('TCP') or {})
         .get(backup_server_port | string) or {} }}

- name: Refuse a port that tailscale serve already uses for something else
  ansible.builtin.assert:
    that: >-
      backup_server_serve_port | length == 0
      or (backup_server_serve_port.TCPForward | default('')) in
         ['localhost:' ~ backup_server_port, '127.0.0.1:' ~ backup_server_port]
    fail_msg: >-
      tailscale serve already uses port {{ backup_server_port }} on {{ inventory_hostname }} for
      something else: {{ backup_server_serve_port }}. Choose another backup_server_port in the data
      repository, or free it by hand (sudo tailscale serve status).
    quiet: true

- name: Add the TCP forwarder for the backup server
  ansible.builtin.command:
    cmd: tailscale serve --bg --tcp={{ backup_server_port }} tcp://localhost:{{ backup_server_port }}
  become: true
  timeout: 60
  changed_when: true
  when: backup_server_serve_port | length == 0
