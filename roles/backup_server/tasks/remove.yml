---
# Stop the server. The copies (the volume and its unit), the password hash and the
# tailscale serve forwarder stay (SPEC 4.2, 8): the copies are the last line of defence.
- name: Remove the container unit with quadlet_deploy
  ansible.builtin.include_role:
    name: quadlet_deploy
  vars:
    quadlet_deploy_units: "{{ backup_server_quadlet_units }}"
    quadlet_deploy_state: absent

- name: Say what stays
  ansible.builtin.debug:
    msg: >-
      {{ backup_server_name }} is stopped and removed. The copies stay in the volume
      {{ backup_server_volume }}.{% for backup_server_served in backup_server_tailscale_serve %} The Tailscale forwarder stays too; to
      remove it by hand: sudo tailscale serve --tcp={{ backup_server_served }} tcp://localhost:{{ backup_server_served }} off{% endfor %}
