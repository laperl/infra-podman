---
- name: Restart node_exporter (obs_agent)
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter.service
    state: restarted
  become: true
  when: obs_agent_services_exist | default(true)

- name: Restart systemd-journal-upload (obs_agent)
  ansible.builtin.systemd_service:
    name: systemd-journal-upload.service
    state: restarted
    daemon_reload: true
  become: true
  when: obs_agent_services_exist | default(true)
