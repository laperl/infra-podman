---
# Interface of podman_secrets: the Podman secrets the calling role needs on this machine,
# by the name they have there (<env>-<name in infra_secrets>). The calling role sets it
# with include_role.
podman_secrets_required: []

# Who asks: the name the calling role has in readers: of infra_secrets, without the
# environment. For example pg-main, ff-laptop, backup, backup-server.
podman_secrets_reader: ""
