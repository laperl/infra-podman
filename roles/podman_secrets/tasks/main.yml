---
# One place to require the Podman secrets a role needs before it changes anything
# (SPEC 4.5). Only whether each one exists is read, never its value. Nothing is created
# here: deploy.sh secrets does that, from KeePassXC.
#
# Use it like this:
#   - name: Require its secrets
#     ansible.builtin.include_role:
#       name: podman_secrets
#     vars:
#       podman_secrets_reader: "{{ myapp_id }}"
#       podman_secrets_required:
#         - "{{ myapp_app_key_secret }}"
#         - "{{ myapp_db_secret }}"
# infra_secrets of the data repository is the only place that says who reads each secret
# (readers:). A role cannot use a secret that does not name it: two applications share a
# secret only when the operator wrote both.
- name: Require that each secret names this reader
  ansible.builtin.assert:
    that:
      - podman_secrets_reader | length > 0
      - podman_secrets_not_for_reader | length == 0
    fail_msg: >-
      {{ podman_secrets_reader }} is not a reader of: {{ podman_secrets_not_for_reader | join(', ') }}.
      In infra_secrets of the data repository each secret says who reads it: write
      {{ podman_secrets_reader }} in readers: of each one, for example
      readers: [{{ podman_secrets_reader }}] (docs/SECRETS_INVENTORY.md).
    quiet: true
  vars:
    podman_secrets_not_for_reader: >-
      {{ podman_secrets_required | map('regex_replace', '^' ~ infra_env ~ '-', '')
         | reject('in', infra_secrets | default([]) | selectattr('readers', 'defined')
                        | selectattr('readers', 'contains', podman_secrets_reader) | map(attribute='name') | list)
         | list }}

- name: Read the service user
  ansible.builtin.include_role:
    name: service_user

- name: Check that each secret exists
  ansible.builtin.command:
    cmd: podman secret exists {{ item }}
  loop: "{{ podman_secrets_required }}"
  environment: "{{ service_user_env }}"
  become: true
  become_user: "{{ service_user }}"
  register: podman_secrets_found
  changed_when: false
  failed_when: podman_secrets_found.rc not in [0, 1]
  check_mode: false

- name: Require them (deploy.sh secrets creates them from KeePassXC)
  ansible.builtin.assert:
    that: podman_secrets_missing | length == 0
    fail_msg: >-
      Missing Podman secrets on {{ inventory_hostname }}: {{ podman_secrets_missing | join(', ') }}.
      Each one needs its entry in KeePassXC ({{ infra_site | default('<infra_site>') }}/<its name
      without {{ infra_env }}->) and its line in infra_secrets of the data repository. Then create
      them: ./deploy.sh secrets --env {{ infra_env }} --limit {{ inventory_hostname }}
    quiet: true
  vars:
    podman_secrets_missing: >-
      {{ podman_secrets_found.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}
