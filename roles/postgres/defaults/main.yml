---
# One PostgreSQL instance per call (D8): pg-<instance>, with its own volume, secret and
# networks. The image lives in playbooks/group_vars/all/images.yml (postgres_image).

postgres_instance: main
postgres_state: present

# The administrator role (docs/POSTGRES.md, section 1). A name chosen by the operator, so
# it is DATA: each instance declares it in the data repository (superuser:). No default
# here, the role refuses to run without it. Applications never use it.
postgres_superuser: ""

# Application databases and their users, as DATA (docs/POSTGRES.md, sections 2 and 6): the
# databases: list of this instance in the data repository. Each item:
#   name: the application, ^[a-z][a-z0-9_]{0,30}$ (database, schema and groups <name>_*)
#   users: optional, LOGIN users, each with
#     name:     ^[a-z][a-z0-9_]{0,62}$; once per database, but it may be in several
#               databases (one role, one password)
#     group:    owner | writer | reader
#     consumer: the application instance that connects with it, by its identifier
#               <app>-<instance> (for example ff-laptop; docs/services/README.md, 3): lower
#               case letters, digits and single hyphens. It gets the network
#               <env>-<consumer>-pg-<instance>-net (D9) and pg_hba.conf admits the user only
#               from there, only to its database.
# Its password: the KeePassXC entry and Podman secret named after the user, with - for _:
# <user>-db-password, for example ff_laptop -> <env>-ff-laptop-db-password (SPEC 4.5). A
# user name is unique on its machine, across instances (playbooks/postgres.yml).
# What is removed from the list is removed from PostgreSQL (docs/POSTGRES.md, section 7).
postgres_databases: []

# Removing every database (databases: missing or empty) needs this set to the name of the
# instance: ./deploy.sh apply postgres --confirm-drop <instance>.
postgres_confirm_drop: ""

# --retire <instance> of deploy.sh: the instance to stop, keeping its data (playbook).
postgres_retire: ""

# What the role creates carries this comment in PostgreSQL; it only removes what has it.
postgres_managed_mark: managed by infra-podman

# Consumers with a network of their own (D9, SPEC 4.4), derived from the users. None: the
# container runs with Network=none, reachable only through podman exec. Do not override.
postgres_consumers: >-
  {{ postgres_databases | selectattr('users') | map(attribute='users') | flatten
     | map(attribute='consumer') | unique | sort }}

# Names of the users, each once, derived. Do not override.
postgres_user_names: >-
  {{ postgres_databases | selectattr('users') | map(attribute='users') | flatten
     | map(attribute='name') | unique | sort }}

# Groups of the declared databases, derived. Do not override.
postgres_group_names: >-
  {{ postgres_databases | map(attribute='name') | product(['_owner', '_writer', '_reader']) | map('join') | list }}

# Subnet of each consumer network, read from Podman by the role (tasks/hba.yml): Podman
# chooses it when it creates the network. Only for CI renders; do not override.
postgres_subnets: {}

# Resource limits, in one place (ROADMAP). Podman 4.9 has no Memory= key, so they go
# through PodmanArgs (docs/COMPATIBILITY.md). Values for a 16 GB laptop.
postgres_memory: 1g
postgres_cpus: "2"
postgres_pids_limit: 500
# PostgreSQL uses /dev/shm for parallel queries; Podman's default is 64m.
postgres_shm_size: 256m

# Fixed parameters of every instance (R34, docs/POSTGRES.md, section 1). They only take
# effect when the data directory is created; the role checks them on every run and stops
# if an instance was created differently. Do not override.
#   locale provider builtin: PostgreSQL's own C.UTF-8, independent of glibc and ICU.
#   PostgreSQL 18 enables data checksums by default; written anyway, to be explicit.
postgres_initdb_args: >-
  --encoding=UTF8 --locale=C.UTF-8 --locale-provider=builtin --builtin-locale=C.UTF-8
  --data-checksums
postgres_timezone: UTC
# What the check reads back from the database postgres, in this order:
# provider|locale|collate|ctype|encoding|checksums|timezone|log_timezone
postgres_expected_instance: b|C.UTF-8|C.UTF-8|C.UTF-8|UTF8|on|UTC|UTC

# Home of the service user. Overwritten by the role with the real one (getent); this value
# only serves to render the templates in CI.
postgres_service_home: /home/svc_runner

# Names (SPEC 4.12). Derived; do not override.
postgres_name: "{{ infra_env }}-pg-{{ postgres_instance }}"
postgres_volume: "{{ postgres_name }}-data"
# KeePassXC entry <infra_site>/pg-<instance>-superuser-password; Podman secret with the
# environment in front.
postgres_secret_key: pg-{{ postgres_instance }}-superuser-password
postgres_secret: "{{ infra_env }}-{{ postgres_secret_key }}"
# pg_hba.conf, generated from the inventory and mounted read-only (docs/POSTGRES.md, 3).
postgres_config_dir: "{{ postgres_service_home }}/.config/infra-podman/{{ postgres_name }}"
postgres_hba_file: "{{ postgres_config_dir }}/pg_hba.conf"

# Network of each consumer: <env>-<consumer>-pg-<instance>-net (SPEC 4.12).
postgres_networks: >-
  {{ postgres_consumers | map('regex_replace', '^(.*)$', infra_env ~ '-\1-pg-' ~ postgres_instance ~ '-net') | list }}

# Groups and users the role declares, in the order they are created.
postgres_managed_roles: "{{ postgres_group_names + postgres_user_names }}"

# What quadlet_deploy installs, and what CI renders (scripts/render-quadlets.yml). One
# .network per consumer, built from the names (no per-item variables in the template).
postgres_quadlet_units: >-
  {{ [{'template': 'pg.container.j2', 'name': postgres_name ~ '.container'},
      {'template': 'pg-data.volume.j2', 'name': postgres_volume ~ '.volume'}]
     + (postgres_networks | map('regex_replace', '^(.*)$', '{"template": "pg-consumer.network.j2", "name": "\1.network"}')
        | map('from_json') | list) }}

# Who got a new password (tasks/apps.yml, from files/pg_passwords.py). Over SSH, script runs
# on a terminal: its output may come with \r\n and with escape sequences of the remote shell
# around it (seen on a DEV VM: OSC 3008). Only the line with the JSON counts.
postgres_passwords_changed: >-
  {{ (postgres_passwords.stdout_lines | default([]) | map('trim') | select('match', '^[{].*[}]$')
      | list | last | default('{}', true) | from_json).changed | default([]) }}
