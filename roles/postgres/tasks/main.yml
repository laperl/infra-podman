---
# One PostgreSQL instance (D8). Validate, install and start it with quadlet_deploy.

- name: Check the instance
  ansible.builtin.assert:
    that:
      - postgres_instance is match('^[a-z0-9]+$')
      - postgres_state in ['present', 'absent']
      - postgres_image is match('^[^ ]+@sha256:[0-9a-f]{64}$')
      - postgres_consumers | length == 0
    fail_msg: >-
      postgres_instance must be lower case letters and digits, postgres_image pinned by digest (D6).
      Consumers and their networks arrive in phase 2.
    quiet: true

- name: Read the service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ service_user }}"

- name: Check that the superuser password exists as a Podman secret
  ansible.builtin.command:
    cmd: podman secret exists {{ postgres_secret }}
  environment:
    HOME: "{{ ansible_facts['getent_passwd'][service_user][4] }}"
    XDG_CONFIG_HOME: "{{ ansible_facts['getent_passwd'][service_user][4] }}/.config"
    XDG_DATA_HOME: "{{ ansible_facts['getent_passwd'][service_user][4] }}/.local/share"
    XDG_RUNTIME_DIR: /run/user/{{ ansible_facts['getent_passwd'][service_user][1] }}
  become: true
  become_user: "{{ service_user }}"
  register: postgres_secret_exists
  changed_when: false
  failed_when: postgres_secret_exists.rc not in [0, 1]
  check_mode: false
  when: postgres_state == 'present'

- name: Require the secret (deploy.sh secrets creates it from KeePassXC)
  ansible.builtin.assert:
    that: postgres_secret_exists.rc == 0
    fail_msg: >-
      The Podman secret {{ postgres_secret }} does not exist on {{ inventory_hostname }}.
      Create it first: ./deploy.sh secrets --env {{ infra_env }} --limit {{ inventory_hostname }}
      (KeePassXC entry Infra_Podman/{{ postgres_secret_key }}).
    quiet: true
  when: postgres_state == 'present'

# Absolute paths, resolved here: role_path passed lazily to quadlet_deploy would point
# at quadlet_deploy itself.
- name: Resolve the templates of this instance
  ansible.builtin.set_fact:
    postgres_units_resolved: >-
      {{ ([] if ansible_loop.first else postgres_units_resolved)
         + [{'name': item.name, 'template': role_path ~ '/templates/' ~ item.template}] }}
  loop: "{{ postgres_quadlet_units }}"
  loop_control:
    extended: true
    label: "{{ item.name }}"

- name: Deploy with quadlet_deploy
  ansible.builtin.include_role:
    name: quadlet_deploy
  vars:
    quadlet_deploy_units: "{{ postgres_units_resolved }}"
    quadlet_deploy_images:
      - "{{ postgres_image }}"
    quadlet_deploy_wait_healthy:
      - "{{ postgres_name }}"
    quadlet_deploy_state: "{{ postgres_state }}"
