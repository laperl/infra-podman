---
# One PostgreSQL instance (D8). Validate, install and start it with quadlet_deploy.

- name: Check the instance
  ansible.builtin.assert:
    that:
      - postgres_instance is match('^[a-z0-9]+$')
      - postgres_state in ['present', 'absent']
      - postgres_image is match('^[^ ]+@sha256:[0-9a-f]{64}$')
      - postgres_superuser is match('^[a-z_][a-z0-9_]{0,62}$')
      - postgres_superuser not in ['backup', 'public']
      - postgres_superuser is not match('^pg_')
    fail_msg: >-
      postgres_instance must be lower case letters and digits, postgres_image pinned by digest (D6).
      Each instance needs its superuser in the data repository (superuser: <name>, lower case,
      not backup, public or pg_*; docs/POSTGRES.md, section 6).
    quiet: true

# docs/POSTGRES.md, section 6. Names go into SQL and pg_hba.conf: only these characters.
- name: Check the databases and users of the instance
  ansible.builtin.assert:
    that:
      - postgres_databases is sequence and postgres_databases is not string
      - postgres_databases | rejectattr('name', 'defined') | list | length == 0
      - postgres_users | rejectattr('name', 'defined') | list | length == 0
      - postgres_users | rejectattr('group', 'defined') | list | length == 0
      - postgres_users | rejectattr('consumer', 'defined') | list | length == 0
      - postgres_databases | map(attribute='name') | select('match', '^[a-z][a-z0-9_]{0,30}$') | list | length == postgres_databases | length
      - postgres_databases | map(attribute='name') | unique | list | length == postgres_databases | length
      - postgres_databases | map(attribute='name') | intersect(['postgres', 'template0', 'template1']) | length == 0
      - postgres_users | map(attribute='name') | select('match', '^[a-z][a-z0-9_]{0,62}$') | list | length == postgres_users | length
      - postgres_users | map(attribute='group') | difference(['owner', 'writer', 'reader']) | length == 0
      - postgres_users | map(attribute='consumer') | select('match', '^[a-z][a-z0-9]*(-[a-z0-9]+)*$') | list | length == postgres_users | length
      - postgres_users | map(attribute='consumer') | reject('match', '^.{1,30}$') | list | length == 0
      - postgres_user_names | intersect(postgres_group_names) | length == 0
      - postgres_per_db | map('length') | list == postgres_per_db | map('unique') | map('list') | map('length') | list
      - postgres_managed_roles | intersect([postgres_superuser, 'backup', 'public', 'postgres']) | length == 0
      - postgres_managed_roles | select('match', '^pg_') | list | length == 0
    fail_msg: >-
      databases: of pg-{{ postgres_instance }} in the data repository (docs/POSTGRES.md, section 6):
      each database a name ^[a-z][a-z0-9_]{0,30}$, not postgres or template*; each user a name
      ^[a-z][a-z0-9_]{0,62}$, once per database (it may be in several), different from the groups
      <database>_owner, _writer and _reader, the superuser, backup, public and pg_*; group owner,
      writer or reader; consumer the identifier of the application instance, lower case letters,
      digits and single hyphens, up to 30 characters (for example ff-laptop).
    quiet: true
  vars:
    postgres_users: >-
      {{ postgres_databases | selectattr('users') | map(attribute='users') | flatten }}
    postgres_per_db: >-
      {{ postgres_databases | selectattr('users') | map(attribute='users') | map('map', attribute='name') | map('list') | list }}

# Its home, ids and environment, read in one place (roles/service_user).
- name: Read the service user
  ansible.builtin.include_role:
    name: service_user

- name: Set the paths and environment of the service user
  ansible.builtin.set_fact:
    postgres_service_home: "{{ service_user_home }}"
    postgres_env: "{{ service_user_env }}"

- name: Check that the superuser password exists as a Podman secret
  ansible.builtin.command:
    cmd: podman secret exists {{ postgres_secret }}
  environment: "{{ postgres_env }}"
  become: true
  become_user: "{{ service_user }}"
  register: postgres_secret_exists
  changed_when: false
  failed_when: postgres_secret_exists.rc not in [0, 1]
  check_mode: false
  when: postgres_state == 'present'

- name: Require the secret (deploy.sh secrets creates it from KeePassXC)
  ansible.builtin.assert:
    that: postgres_secret_exists.rc == 0
    fail_msg: >-
      The Podman secret {{ postgres_secret }} does not exist on {{ inventory_hostname }}.
      Create it first: ./deploy.sh secrets --env {{ infra_env }} --limit {{ inventory_hostname }}
      (KeePassXC entry {{ infra_site | default('<infra_site>') }}/{{ postgres_secret_entry }}).
    quiet: true
  when: postgres_state == 'present'

- name: Check that the password of each user exists as a Podman secret
  ansible.builtin.command:
    cmd: podman secret exists {{ infra_env }}-{{ item | replace('_', '-') }}-db-password
  loop: "{{ postgres_user_names }}"
  environment: "{{ postgres_env }}"
  become: true
  become_user: "{{ service_user }}"
  register: postgres_user_secrets
  changed_when: false
  failed_when: postgres_user_secrets.rc not in [0, 1]
  check_mode: false
  when: postgres_state == 'present'

- name: Require them (deploy.sh secrets creates them from KeePassXC)
  ansible.builtin.assert:
    that: postgres_missing | length == 0
    fail_msg: >-
      Missing Podman secrets on {{ inventory_hostname }}: {{ postgres_missing | join(', ') }}.
      Declare each one in infra_secrets (group postgres_hosts), with its KeePassXC entry
      {{ infra_site | default('<infra_site>') }}/<user, with - for _>-db-password (ff_laptop: ff-laptop-db-password),
      and create them:
      ./deploy.sh secrets --env {{ infra_env }} --limit {{ inventory_hostname }}
    quiet: true
  vars:
    postgres_missing: >-
      {{ postgres_user_secrets.results | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | map('replace', '_', '-') | map('regex_replace', '^(.*)$', infra_env ~ '-\1-db-password')
         | list }}
  when: postgres_state == 'present'

# Written before the container starts: it is mounted read-only into it. A change is
# applied with a reload in setup.yml, without restarting PostgreSQL.
- name: Create the configuration directory of the instance
  ansible.builtin.file:
    path: "{{ postgres_config_dir }}"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ service_user }}"
  when: postgres_state == 'present'

# With the subnets of the networks that already exist. A new network only exists once
# PostgreSQL starts with it: setup.yml writes the file again after the start.
- name: Start this instance with pg_hba.conf unchanged
  ansible.builtin.set_fact:
    postgres_hba_changed: false

- name: Write pg_hba.conf
  ansible.builtin.include_tasks: hba.yml
  when: postgres_state == 'present'

# What is no longer in the inventory (docs/POSTGRES.md, section 7): worked out, checked
# and backed up now, before anything changes; dropped by setup.yml after the deploy.
- name: Check what would be dropped
  ansible.builtin.include_tasks: drop_check.yml
  when: postgres_state == 'present'

# Before PostgreSQL restarts on a new image, a backup, so the operator can go back by hand
# (D11, ROADMAP). Only when the instance is running: a stopped one cannot be dumped.
- name: Back up before an image change
  ansible.builtin.include_tasks: backup_before_image_change.yml
  when: postgres_state == 'present'

# Absolute paths, resolved here: role_path passed lazily to quadlet_deploy would point
# at quadlet_deploy itself.
- name: Resolve the templates of this instance
  ansible.builtin.set_fact:
    postgres_units_resolved: >-
      {{ ([] if ansible_loop.first else postgres_units_resolved)
         + [{'name': item.name, 'template': role_path ~ '/templates/' ~ item.template}] }}
  loop: "{{ postgres_quadlet_units }}"
  loop_control:
    extended: true
    label: "{{ item.name }}"

- name: Deploy with quadlet_deploy
  ansible.builtin.include_role:
    name: quadlet_deploy
  vars:
    quadlet_deploy_units: "{{ postgres_units_resolved }}"
    quadlet_deploy_images:
      - "{{ postgres_image }}"
    quadlet_deploy_wait_healthy:
      - "{{ postgres_name }}"
    quadlet_deploy_state: "{{ postgres_state }}"

- name: Check and set up the instance
  ansible.builtin.include_tasks: setup.yml
  when: postgres_state == 'present'
