---
# Included by backup_before_image_change.yml and drop_check.yml: runs the daily backup
# service now (all the databases of the machine) and waits for it. If there is no backup
# service, or it fails, the playbook stops before changing anything. Parameters:
#   postgres_backup_reason       pre-upgrade | pre-drop (the reason= tag of the copy)
#   postgres_backup_missing_msg  no backup service on this machine
#   postgres_backup_plan_msg     what a plan says
#   postgres_backup_failed_msg   the backup failed (the logs are added)
- name: Find the backup service of the backup playbook
  ansible.builtin.command:
    argv: [systemctl, --user, cat, "{{ infra_env }}-backup.service"]
  environment: "{{ postgres_env }}"
  become: true
  become_user: "{{ service_user }}"
  register: postgres_backup_unit
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require the backup service
  ansible.builtin.assert:
    that: postgres_backup_unit.rc == 0
    fail_msg: >-
      {{ postgres_backup_missing_msg }}
    quiet: true

- name: Say what the plan would do
  ansible.builtin.debug:
    msg: "{{ postgres_backup_plan_msg }}"
  when: ansible_check_mode

# Tagged with its reason (pre-upgrade, pre-drop): its own retention group, so a daily run
# never removes it.
- name: Mark the reason of the next backup
  ansible.builtin.copy:
    content: "{{ postgres_backup_reason }}\n"
    dest: "{{ postgres_service_home }}/.local/state/infra-podman/backup/next-reason"
    mode: "0600"
  become: true
  become_user: "{{ service_user }}"
  when: not ansible_check_mode

# Waits until the one-shot service ends; a failed backup stops the playbook here.
- name: Run the backup now
  ansible.builtin.command:
    argv: [systemctl, --user, start, "{{ infra_env }}-backup.service"]
  environment: "{{ postgres_env }}"
  become: true
  become_user: "{{ service_user }}"
  register: postgres_backup_run
  changed_when: true
  failed_when: false
  when: not ansible_check_mode

- name: Stop if the backup failed (nothing is changed)
  ansible.builtin.assert:
    that: postgres_backup_run.rc == 0
    fail_msg: >-
      {{ postgres_backup_failed_msg }} Logs:
      sudo journalctl _SYSTEMD_USER_UNIT={{ infra_env }}-backup.service -n 100
    quiet: true
  when: not ansible_check_mode
