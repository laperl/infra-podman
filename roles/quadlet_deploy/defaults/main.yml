---
# Interface of quadlet_deploy (SPEC 4.2). The calling role sets these with include_role.
#
# Units to install. Each item:
#   template: the .j2 file, by its name inside quadlet_deploy_templates
#   name:     file name, the same as the object it creates (SPEC 4.12), e.g. prod-pg-main.container
quadlet_deploy_units: []

# Folder with those templates: the templates/ of the role that includes this one. Ansible
# gives the path of that role in ansible_parent_role_paths, the nearest first; role_path
# would be this role's own. Only set it to use another folder.
quadlet_deploy_templates: "{{ ansible_parent_role_paths[0] }}/templates"

# Images the units use, pulled before starting so the first start does not run into
# TimeoutStartSec while downloading.
quadlet_deploy_images: []

# Containers to wait for until their healthcheck passes (container names).
quadlet_deploy_wait_healthy: []
quadlet_deploy_health_retries: 30
quadlet_deploy_health_delay: 5

# false for one-shot containers started by a timer (the backup): install and validate
# only; never start them, nor restart them when their unit changes.
quadlet_deploy_start: true

# present: install, validate and start. absent: stop and remove the .container files only;
# the .volume and .network files and the data stay (SPEC 4.2, 8).
quadlet_deploy_state: present

# Only with state absent and an explicit request: also remove .volume and .network files
# and delete the volumes. Destroys data. Never set it by default.
quadlet_deploy_purge: false

quadlet_deploy_generator: /usr/lib/systemd/system-generators/podman-system-generator
