---
# SPEC 4.2: render the units of one service, validate them with the host's own Quadlet
# generator, install them in the service user's ~/.config/containers/systemd/, reload and
# restart only what changed. A second apply without changes gives zero changes.

- name: Check the interface
  ansible.builtin.assert:
    that:
      - service_user is defined
      - quadlet_deploy_state in ['present', 'absent']
      - quadlet_deploy_units | length > 0
      - quadlet_deploy_units | selectattr('template', 'undefined') | list | length == 0
      - quadlet_deploy_units | selectattr('name', 'undefined') | list | length == 0
      - quadlet_deploy_units | map(attribute='name') | map('regex_search', '\.(container|network|volume)$') | select('none') | list | length == 0
      - not quadlet_deploy_purge or quadlet_deploy_state == 'absent'
      - quadlet_deploy_start or quadlet_deploy_wait_healthy | length == 0
    fail_msg: "quadlet_deploy needs quadlet_deploy_units (template, name), only .container, .network and .volume; purge only with state absent"
    quiet: true

# Its home and environment, read in one place (roles/service_user), which also stops
# with a clear message when the user does not exist yet.
- name: Read the service user
  ansible.builtin.include_role:
    name: service_user

- name: Set the paths and environment of the service user
  ansible.builtin.set_fact:
    quadlet_deploy_dir: "{{ service_user_home }}/.config/containers/systemd"
    quadlet_deploy_env: "{{ service_user_env }}"
    quadlet_deploy_containers: "{{ quadlet_deploy_units | map(attribute='name') | select('match', '.*\\.container$') | list }}"
    quadlet_deploy_changed_services: []

# Separate files, so meta: flush_handlers does not inherit a condition.
- name: Install the units
  ansible.builtin.include_tasks: install.yml
  when: quadlet_deploy_state == 'present'

- name: Remove the units
  ansible.builtin.include_tasks: remove.yml
  when: quadlet_deploy_state == 'absent'
