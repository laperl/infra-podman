---
# Included by main.yml when quadlet_deploy_state is present.
# Validation runs in plan too: it only writes to a temporary directory.
- name: Create a temporary directory for validation
  ansible.builtin.tempfile:
    state: directory
    prefix: quadlet-
  become: true
  become_user: "{{ service_user }}"
  register: quadlet_deploy_tmp
  check_mode: false
  changed_when: false

- name: Validate with the host's Quadlet generator
  block:
    - name: Render the units into the temporary directory
      ansible.builtin.template:
        src: "{{ quadlet_deploy_common if item.common | default(false) else quadlet_deploy_templates }}/{{ item.template }}"
        dest: "{{ quadlet_deploy_tmp.path }}/{{ item.name }}"
        mode: "0644"
      loop: "{{ quadlet_deploy_units }}"
      loop_control:
        label: "{{ item.name }}"
      become: true
      become_user: "{{ service_user }}"
      check_mode: false
      changed_when: false

    # The new units first, then the installed ones: a unit may use one another role installs
    # (Firefly's container, the .network of the postgres role), and Podman 5 refuses a
    # reference it cannot find. On the same name the first directory wins (cmd/quadlet,
    # loadUnitsFromDir), so the new version is the one checked. Same in Podman 4.9.
    - name: Run the generator in dry-run mode (SPEC 4.2)
      ansible.builtin.command:
        cmd: "{{ quadlet_deploy_generator }} --user --dryrun"
      environment: >-
        {{ quadlet_deploy_env | combine({'QUADLET_UNIT_DIRS': quadlet_deploy_tmp.path ~ ':' ~ quadlet_deploy_dir}) }}
      become: true
      become_user: "{{ service_user }}"
      register: quadlet_deploy_dryrun
      check_mode: false
      changed_when: false
      failed_when: quadlet_deploy_dryrun.rc != 0 or 'unsupported key' in quadlet_deploy_dryrun.stderr
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ quadlet_deploy_tmp.path }}"
        state: absent
      become: true
      become_user: "{{ service_user }}"
      check_mode: false
      changed_when: false

- name: Create the Quadlet directory of the service user
  ansible.builtin.file:
    path: "{{ quadlet_deploy_dir }}"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ service_user }}"

# A way out limited to some destinations (egress.network.j2) is done with routes, which
# netavark honours from 1.7.0. An older one accepts them and ignores them, without a word:
# the network would look limited and reach everything. Said here, in plan and in apply,
# and by the check playbook as a problem (docs/COMPATIBILITY.md).
- name: Ask Podman for its network stack
  ansible.builtin.command:
    cmd: podman info --format {% raw %}'{{.Host.NetworkBackendInfo.Version}}'{% endraw %}
  environment: "{{ quadlet_deploy_env }}"
  become: true
  become_user: "{{ service_user }}"
  register: quadlet_deploy_network_stack
  changed_when: false
  check_mode: false
  when: quadlet_deploy_limited | length > 0

- name: Warn that this machine does not limit the way out
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ quadlet_deploy_limited | join(', ') }} limits the way out of its container to some
      destinations with routes, and this machine has {{ quadlet_deploy_network_stack.stdout }}, which
      ignores them (netavark 1.7.0 or newer is needed). The network is created WITHOUT that limit: its
      container can reach everything, the internet and the local network. `./deploy.sh plan check`
      reports it as a problem. See docs/COMPATIBILITY.md.
  when:
    - quadlet_deploy_limited | length > 0
    - not quadlet_deploy_network_stack.stdout is match('netavark ')
      or (quadlet_deploy_network_stack.stdout | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('0.0.0', true))
      is version('1.7.0', '<')

# Before writing anything: a network whose unit is about to change and that already
# exists will be created again, and that must be possible (network_users.yml).
- name: See which network units are about to change
  ansible.builtin.template:
    src: "{{ quadlet_deploy_common if item.common | default(false) else quadlet_deploy_templates }}/{{ item.template }}"
    dest: "{{ quadlet_deploy_dir }}/{{ item.name }}"
    mode: "0644"
  loop: "{{ quadlet_deploy_units | selectattr('name', 'match', '.*\\.network$') | list }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: "{{ service_user }}"
  register: quadlet_deploy_network_preview
  check_mode: true

- name: Check which of those networks already exist
  ansible.builtin.command:
    cmd: podman network exists {{ item }}
  loop: >-
    {{ quadlet_deploy_network_preview.results | selectattr('changed') | map(attribute='item.name')
       | map('regex_replace', '\.network$', '') | list }}
  environment: "{{ quadlet_deploy_env }}"
  become: true
  become_user: "{{ service_user }}"
  register: quadlet_deploy_network_exists_all
  changed_when: false
  failed_when: quadlet_deploy_network_exists_all.rc not in [0, 1]
  check_mode: false

- name: Check that those networks can be created again
  ansible.builtin.include_tasks: network_users.yml
  loop: "{{ quadlet_deploy_network_exists_all.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
  loop_control:
    loop_var: quadlet_deploy_network

- name: Install the units
  ansible.builtin.template:
    src: "{{ quadlet_deploy_common if item.common | default(false) else quadlet_deploy_templates }}/{{ item.template }}"
    dest: "{{ quadlet_deploy_dir }}/{{ item.name }}"
    mode: "0644"
  loop: "{{ quadlet_deploy_units }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: "{{ service_user }}"
  register: quadlet_deploy_installed
  notify:
    - Reload the service user's systemd (quadlet_deploy)
    - Restart the changed containers (quadlet_deploy)

# Only containers are restarted, and only those that run all the time (quadlet_deploy_start).
# Podman does not change an existing network or volume when its file changes (the
# generated service uses --ignore). A network holds no data, so it is created again
# (recreate_network.yml); a volume holds data, and changing it needs a person.
- name: List the containers whose units changed
  ansible.builtin.set_fact:
    quadlet_deploy_changed_services: >-
      {{ quadlet_deploy_installed.results | selectattr('changed') | map(attribute='item.name')
         | select('match', '.*\.container$') | map('regex_replace', '\.container$', '.service') | list
         if quadlet_deploy_start else [] }}
    quadlet_deploy_changed_volumes: >-
      {{ quadlet_deploy_installed.results | selectattr('changed') | map(attribute='item.name')
         | select('match', '.*\.volume$') | list }}
    quadlet_deploy_changed_networks: >-
      {{ quadlet_deploy_installed.results | selectattr('changed') | map(attribute='item.name')
         | select('match', '.*\.network$') | map('regex_replace', '\.network$', '') | list }}

- name: Warn about changed volumes
  ansible.builtin.debug:
    msg: >-
      Changed {{ quadlet_deploy_changed_volumes | join(', ') }}. If the volume already exists, Podman
      keeps it as it is: changing a volume is a manual step, because it holds data.
  when: quadlet_deploy_changed_volumes | length > 0

# A new network needs nothing: its service creates it. One that already existed does.
- name: Create again the networks whose unit changed
  ansible.builtin.include_tasks: recreate_network.yml
  loop: >-
    {{ quadlet_deploy_network_exists_all.results | selectattr('rc', 'equalto', 0) | map(attribute='item')
       | select('in', quadlet_deploy_changed_networks) | list }}
  loop_control:
    loop_var: quadlet_deploy_network

- name: Check which images are already present
  ansible.builtin.command:
    cmd: podman image exists {{ item }}
  loop: "{{ quadlet_deploy_images }}"
  environment: "{{ quadlet_deploy_env }}"
  become: true
  become_user: "{{ service_user }}"
  register: quadlet_deploy_image_exists
  changed_when: false
  failed_when: quadlet_deploy_image_exists.rc not in [0, 1]
  check_mode: false

- name: Pull the missing images
  ansible.builtin.command:
    cmd: podman pull --quiet {{ item.item }}
  loop: "{{ quadlet_deploy_image_exists.results | selectattr('rc', 'equalto', 1) | list }}"
  loop_control:
    label: "{{ item.item }}"
  environment: "{{ quadlet_deploy_env }}"
  become: true
  become_user: "{{ service_user }}"
  changed_when: true

# In a plan nothing is reloaded, so a new unit does not exist for systemd yet.
- name: Show what would be restarted
  ansible.builtin.debug:
    msg: "Would restart: {{ quadlet_deploy_changed_services | join(', ') }}"
  when: ansible_check_mode and quadlet_deploy_changed_services | length > 0

- name: Run the reload and the restarts now
  ansible.builtin.meta: flush_handlers

# A container started by a timer (quadlet_deploy_start false) would create its network
# only on its first run: created now, the network is there to be seen and checked.
- name: Make sure every network exists
  ansible.builtin.systemd_service:
    name: "{{ item | regex_replace('\\.network$', '-network.service') }}"
    state: started
    scope: user
  loop: "{{ quadlet_deploy_units | map(attribute='name') | select('match', '.*\\.network$') | list }}"
  environment: "{{ quadlet_deploy_env }}"
  become: true
  become_user: "{{ service_user }}"
  when: not ansible_check_mode

- name: Make sure every container is running
  ansible.builtin.systemd_service:
    name: "{{ item | regex_replace('\\.container$', '.service') }}"
    state: started
    scope: user
  loop: "{{ quadlet_deploy_containers if quadlet_deploy_start else [] }}"
  environment: "{{ quadlet_deploy_env }}"
  become: true
  become_user: "{{ service_user }}"
  when: not ansible_check_mode or (item | regex_replace('\.container$', '.service')) not in quadlet_deploy_changed_services

- name: Remove the networks the role no longer wants
  ansible.builtin.include_tasks: absent_network.yml
  loop: "{{ quadlet_deploy_absent_networks }}"
  loop_control:
    loop_var: quadlet_deploy_network

# D11: no automatic rollback for services with data. If the healthcheck does not pass,
# stop the service and tell the operator.
- name: Wait for the healthcheck
  when: not ansible_check_mode
  block:
    - name: Wait until the healthcheck passes
      ansible.builtin.command:
        cmd: podman healthcheck run {{ item }}
      loop: "{{ quadlet_deploy_wait_healthy }}"
      environment: "{{ quadlet_deploy_env }}"
      become: true
      become_user: "{{ service_user }}"
      register: quadlet_deploy_health
      until: quadlet_deploy_health.rc == 0
      retries: "{{ quadlet_deploy_health_retries }}"
      delay: "{{ quadlet_deploy_health_delay }}"
      changed_when: false
  rescue:
    - name: Stop the unhealthy services (D11)
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        state: stopped
        scope: user
      loop: "{{ quadlet_deploy_wait_healthy }}"
      environment: "{{ quadlet_deploy_env }}"
      become: true
      become_user: "{{ service_user }}"

    - name: Tell the operator
      ansible.builtin.fail:
        msg: >-
          {{ quadlet_deploy_wait_healthy | join(', ') }} did not pass its healthcheck in
          {{ (quadlet_deploy_health_retries | int) * (quadlet_deploy_health_delay | int) }} s and has been STOPPED,
          without rolling back the image (D11). Its logs: sudo journalctl _SYSTEMD_USER_UNIT=<name>.service -n 50
