---
# Included by main.yml. In the OPERATOR's account (the user Ansible logs in with), not the
# service user's: the menu (rofi drun) reads ~/.local/share/applications (R47, SPEC 4.14).
- name: Find the operator
  ansible.builtin.command:
    cmd: id -un
  become: false
  register: pgadmin_operator
  changed_when: false
  check_mode: false

- name: Read the operator's home
  ansible.builtin.getent:
    database: passwd
    key: "{{ pgadmin_operator.stdout }}"

- name: Set the path of the launcher
  ansible.builtin.set_fact:
    pgadmin_launcher_file: >-
      {{ ansible_facts['getent_passwd'][pgadmin_operator.stdout][4] }}/.local/share/applications/{{ pgadmin_launcher_file_name }}

- name: Create the operator's applications directory
  ansible.builtin.file:
    path: "{{ pgadmin_launcher_file | dirname }}"
    state: directory
    mode: "0755"
  become: false
  when: pgadmin_state == 'present' and pgadmin_launcher | bool

- name: Install the launcher
  ansible.builtin.template:
    src: pgadmin.desktop.j2
    dest: "{{ pgadmin_launcher_file }}"
    mode: "0644"
  become: false
  when: pgadmin_state == 'present' and pgadmin_launcher | bool

- name: Remove the launcher
  ansible.builtin.file:
    path: "{{ pgadmin_launcher_file }}"
    state: absent
  become: false
  when: pgadmin_state == 'absent' or not pgadmin_launcher | bool
