---
# Daily local backup of one machine (SPEC 4.11, R19): every database of every PostgreSQL
# instance of the machine and, on the laptop, the operator's data repository. Copy to the
# GX10 arrives in phase 1e2. The image lives in playbooks/group_vars/all/images.yml.

backup_state: present

# When the daily run starts (systemd OnCalendar). Persistent: a run missed because the
# machine was off happens at the next start.
backup_time: "13:00"

# Retention of the local repository (R28): 7 daily, 12 monthly and 5 yearly.
backup_keep_daily: 7
backup_keep_monthly: 12
backup_keep_yearly: 5

# Only on the laptop, in its host_vars of the data repository:
#   backup_data_repo: the copy of the data repository that deploy.sh leaves in
#     backup_data_repo_dir is backed up too (SPEC 4.13).
#   backup_notify: desktop notification for the operator when a backup failed or is older
#     than backup_notify_max_age_hours. Installed in the OPERATOR's account.
backup_data_repo: false
backup_notify: false
backup_notify_max_age_hours: 36

# Copy to the backup server (phase 1e2, R44): only when backup_remote_url is set, in
# host_vars of the data repository. Every hour, if the server answers, restic copies
# there the snapshots it does not have yet. The local repository is never changed.
#   backup_remote_url: the server, without a path. In prod, the GX10 through Tailscale:
#     http://<Tailscale name or IP of the GX10>:<backup_server_port>. In dev and CI, where
#     server and client are the same machine: http://127.0.0.1:8000, with
#   backup_remote_network: container:<env>-backup-server (it shares the server's network).
#   The repository there is <infra_site>/<infra_env>-<this machine>, and the user infra_site
#   (rest-server accepts at most two folder levels).
backup_remote_url: ""
backup_remote_network: ""
# The server's size limit (group_vars/all.yml, shared with the server) and when to warn.
backup_remote_max_size_gb: "{{ backup_server_max_size_gb | default(30) }}"
backup_remote_warn_percent: 80
# Notification when the last good copy to the server is older than this (7 days).
backup_remote_max_age_hours: 168
# Minute of every hour when the copy runs: away from the local backup at backup_time.
backup_copy_minute: 30

# Limit for the restic container (docs/COMPATIBILITY.md: no Memory= key in 4.9).
backup_memory: 1g
backup_timeout: 2h

# Paths shared with deploy.sh and the operator's notifier. Do not override.
backup_shared_dir: /var/lib/infra-podman
backup_data_repo_dir: "{{ backup_shared_dir }}/data-repo"
backup_status_dir: "{{ backup_shared_dir }}/backup-status"

# Home of the service user. Overwritten by the role with the real one (getent); this value
# only serves to render the templates in CI.
backup_home: /home/svc_runner

# Names (SPEC 4.12). Derived; do not override.
backup_name: "{{ infra_env }}-backup"
backup_volume: "{{ backup_name }}-repo"
backup_secret_key: backup-restic-password
backup_secret: "{{ infra_env }}-{{ backup_secret_key }}"
backup_scripts_dir: "{{ backup_home }}/.local/share/infra-podman/backup"
backup_config_dir: "{{ backup_home }}/.config/infra-podman/backup"
backup_staging_dir: "{{ backup_home }}/.local/state/infra-podman/backup/staging"
backup_copy_name: "{{ backup_name }}-copy"
backup_copy_secret_key: backup-server-password
backup_copy_secret: "{{ infra_env }}-{{ backup_copy_secret_key }}"
backup_copy_state_dir: "{{ backup_home }}/.local/state/infra-podman/backup-copy"

# What quadlet_deploy installs, and what CI renders (scripts/render-quadlets.yml). The
# copy container is installed only with backup_remote_url (tasks/install.yml).
backup_quadlet_units:
  - template: backup.container.j2
    name: "{{ backup_name }}.container"
  - template: backup-repo.volume.j2
    name: "{{ backup_volume }}.volume"
  - template: backup-copy.container.j2
    name: "{{ backup_copy_name }}.container"
