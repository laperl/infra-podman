---
# The restic password and, with backup_remote_url, the password of the backup server.
- name: Require its secrets
  ansible.builtin.include_role:
    name: podman_secrets
  vars:
    podman_secrets_required: >-
      {{ [backup_secret] + ([backup_copy_secret] if backup_remote_url | length > 0 else []) }}

# Shared with deploy.sh and the operator's notifier, outside every home directory.
- name: Create the shared directory
  ansible.builtin.file:
    path: "{{ backup_shared_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create the status directory (written by the service user, read by the operator)
  ansible.builtin.file:
    path: "{{ backup_status_dir }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ backup_gid }}"
    mode: "0755"
  become: true

- name: Find the operator (the user Ansible logs in with)
  ansible.builtin.command:
    cmd: id -un
  become: false
  register: backup_operator
  changed_when: false
  check_mode: false
  when: backup_data_repo or backup_notify

# deploy.sh, run by the operator, leaves the copy of the data repository here; only the
# operator and the service user can read it (setgid: new files get the service group).
- name: Create the directory for the copy of the data repository
  ansible.builtin.file:
    path: "{{ backup_data_repo_dir }}"
    state: directory
    owner: "{{ backup_operator.stdout }}"
    group: "{{ backup_gid }}"
    mode: "2750"
  become: true
  when: backup_data_repo

- name: Create the directories of the service user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ backup_scripts_dir }}"
    - "{{ backup_config_dir }}"
    - "{{ backup_staging_dir | dirname }}"
  become: true
  become_user: "{{ service_user }}"

- name: Install the scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ backup_scripts_dir }}/{{ item }}"
    mode: "0755"
  loop:
    - backup-prepare.sh
    - backup-run.sh
    - backup-status.sh
    - backup-copy.sh
    - backup-copy-status.sh
  become: true
  become_user: "{{ service_user }}"

- name: Write what to back up
  ansible.builtin.template:
    src: backup.conf.j2
    dest: "{{ backup_config_dir }}/backup.conf"
    mode: "0644"
  become: true
  become_user: "{{ service_user }}"

# The container only runs when the timer starts it: quadlet_deploy must not start it,
# nor restart it when its unit changes (that would run a backup on every apply). The copy
# container, only with backup_remote_url.
- name: Deploy with quadlet_deploy
  ansible.builtin.include_role:
    name: quadlet_deploy
  vars:
    quadlet_deploy_units: >-
      {{ backup_quadlet_units | rejectattr('name', 'equalto', backup_copy_name ~ '.container') | list
         if backup_remote_url | length == 0 else backup_quadlet_units }}
    quadlet_deploy_images:
      - "{{ restic_image }}"
    quadlet_deploy_start: false
    quadlet_deploy_state: present

- name: Install, enable and start the daily timer
  ansible.builtin.include_role:
    name: user_units
  vars:
    user_units_files:
      - template: backup.timer.j2
        name: "{{ backup_name }}.timer"
    user_units_timer: "{{ backup_name }}.timer"

- name: Copy to the backup server, or no copy
  ansible.builtin.include_tasks: "{{ 'copy.yml' if backup_remote_url | length > 0 else 'copy_remove.yml' }}"

- name: Install the operator's notifier
  ansible.builtin.include_tasks: notify.yml
  when: backup_notify
