---
# In the OPERATOR's account, not the service user's: the desktop notification can only
# be shown in the operator's own session (SPEC 4.11). Configuration outside the repo, in
# ~/.local/libexec/infra-podman and ~/.config/systemd/user of the operator.
- name: Read the operator's home
  ansible.builtin.getent:
    database: passwd
    key: "{{ backup_operator.stdout }}"

- name: Set the operator's paths
  ansible.builtin.set_fact:
    backup_operator_home: "{{ ansible_facts['getent_passwd'][backup_operator.stdout][4] }}"

- name: Create the operator's directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ backup_operator_home }}/.local/libexec/infra-podman"
    - "{{ backup_operator_home }}/.config/systemd/user"
  become: false

- name: Install the notifier script
  ansible.builtin.copy:
    src: backup-notify.sh
    dest: "{{ backup_operator_home }}/.local/libexec/infra-podman/backup-notify.sh"
    mode: "0755"
  become: false

- name: Install the notifier units
  ansible.builtin.template:
    src: backup-notify.{{ item }}.j2
    dest: "{{ backup_operator_home }}/.config/systemd/user/infra-podman-backup-notify.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  become: false
  register: backup_notify_units

- name: Reload the operator's systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: false
  when: backup_notify_units is changed and not ansible_check_mode

- name: Enable and start the notifier timer
  ansible.builtin.systemd_service:
    name: infra-podman-backup-notify.timer
    enabled: true
    state: started
    scope: user
  become: false
  when: not (ansible_check_mode and backup_notify_units is changed)
