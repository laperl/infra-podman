---
# Stop the daily backups and the copy to the backup server. The repository volume and its
# unit stay (SPEC 4.2, 8), and so do the copies on the server. The
# operator's notifier stays too: remove it by hand (docs/SETUP.md, step 17).
- name: Stop and remove the timers
  ansible.builtin.include_role:
    name: user_units
  vars:
    user_units_state: absent
    user_units_files:
      - name: "{{ backup_timer_item }}"
    user_units_timer: "{{ backup_timer_item }}"
  loop:
    - "{{ backup_name }}.timer"
    - "{{ backup_copy_name }}.timer"
  loop_control:
    loop_var: backup_timer_item

- name: Remove the container unit with quadlet_deploy
  ansible.builtin.include_role:
    name: quadlet_deploy
  vars:
    quadlet_deploy_units: "{{ backup_quadlet_units }}"
    quadlet_deploy_state: absent
