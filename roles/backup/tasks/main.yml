---
# Daily local backup of one machine (SPEC 4.11). See defaults/main.yml.

- name: Check the backup settings
  ansible.builtin.assert:
    that:
      - backup_state in ['present', 'absent']
      - restic_image is match('^[^ ]+@sha256:[0-9a-f]{64}$')
      - infra_site is defined and infra_site is match('^[a-z][a-z0-9-]{1,30}$')
      - backup_time is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
      - backup_keep_daily | int > 0
      - backup_keep_monthly | int > 0
      - backup_keep_yearly | int > 0
      - backup_remote_url | length == 0 or backup_remote_url is match('^https?://[A-Za-z0-9.:-]+$')
      - backup_remote_network | length == 0 or backup_remote_network is match('^container:[a-z0-9-]+$')
      - backup_remote_max_size_gb | float > 0
      - backup_copy_minute | int >= 0 and backup_copy_minute | int <= 59
    fail_msg: >-
      restic_image pinned by digest (D6), infra_site declared in the data repository (R42),
      backup_time as HH:MM, positive retention values (R28) and, for the copy to the backup
      server (R44), backup_remote_url as http://<name or IP>:<port> with no path,
      backup_remote_network empty or container:<name>, a size limit above 0 and
      backup_copy_minute between 0 and 59.
    quiet: true

# Its home, ids and environment, read in one place (roles/service_user).
- name: Read the service user
  ansible.builtin.include_role:
    name: service_user

- name: Set the paths and environment of the service user
  ansible.builtin.set_fact:
    backup_home: "{{ service_user_home }}"
    backup_gid: "{{ service_user_gid }}"
    backup_env: "{{ service_user_env }}"
    # Instances of this machine, if it is a PostgreSQL host (playbooks/postgres.yml).
    backup_pg_instances: "{{ postgres_instances | default([]) if 'postgres_hosts' in group_names else [] }}"

- name: Install the backup
  ansible.builtin.include_tasks: install.yml
  when: backup_state == 'present'

- name: Remove the backup, keeping the repository
  ansible.builtin.include_tasks: remove.yml
  when: backup_state == 'absent'
