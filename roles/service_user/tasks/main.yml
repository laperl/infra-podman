---
# Facts about the service user (D3), read in one place for every role and playbook that
# runs Podman or systemctl --user as that user. It only reads: it changes nothing on the
# machine, and it is safe to include as many times as needed.
#
# Sets:
#   service_user_home  its home directory
#   service_user_uid   its user id
#   service_user_gid   its primary group id
#   service_user_env   the environment for every task with become_user: service_user
#
# Use it like this:
#   - name: Read the service user
#     ansible.builtin.include_role:
#       name: service_user
#   - name: Any command as the service user
#     ansible.builtin.command: podman ps
#     become: true
#     become_user: "{{ service_user }}"
#     environment: "{{ service_user_env }}"
- name: Read the service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ service_user }}"
    fail_key: false

- name: Require the service user (playbook base)
  ansible.builtin.assert:
    that: ansible_facts['getent_passwd'][service_user] is not none
    fail_msg: "{{ service_user }} does not exist on {{ inventory_hostname }}. Apply the base playbook first (docs/WORKFLOW.md)."
    quiet: true

# What sudo keeps from the caller's environment depends on the sudoers policy, and Podman
# reads $HOME, $XDG_CONFIG_HOME and $XDG_DATA_HOME (the GitHub runner sets the XDG ones
# to its own user), plus the user bus in $XDG_RUNTIME_DIR. All of them explicit.
- name: Set the paths, ids and environment of the service user
  ansible.builtin.set_fact:
    service_user_home: "{{ ansible_facts['getent_passwd'][service_user][4] }}"
    service_user_uid: "{{ ansible_facts['getent_passwd'][service_user][1] }}"
    service_user_gid: "{{ ansible_facts['getent_passwd'][service_user][2] }}"
    service_user_env:
      HOME: "{{ ansible_facts['getent_passwd'][service_user][4] }}"
      XDG_CONFIG_HOME: "{{ ansible_facts['getent_passwd'][service_user][4] }}/.config"
      XDG_DATA_HOME: "{{ ansible_facts['getent_passwd'][service_user][4] }}/.local/share"
      XDG_RUNTIME_DIR: /run/user/{{ ansible_facts['getent_passwd'][service_user][1] }}
