---
# One instance of Firefly III (docs/services/firefly.md, R48), the item firefly_item of
# firefly_instances. Check what it needs, install and start it with quadlet_deploy, then
# its daily scheduled tasks and the operator's launcher.

- name: Check the settings of the instance
  ansible.builtin.assert:
    that:
      - firefly_state in ['present', 'absent']
      - firefly_instance is match('^[a-z0-9]{1,14}$')
      - firefly_image_var is match('^firefly[a-z0-9_]*_image$')
      - lookup('ansible.builtin.vars', firefly_image_var, default='') is match('^[^ ]+@sha256:[0-9a-f]{64}$')
      - firefly_port | string is match('^[0-9]+$')
      - firefly_port | int >= 1024 and firefly_port | int <= 65535
      - firefly_language is match('^[a-z]{2}_[A-Z]{2}$')
      - firefly_timezone is match('^[A-Za-z0-9_+/-]+$')
      - firefly_log_level in ['debug', 'info', 'notice', 'warning', 'error', 'critical', 'alert', 'emergency']
      - firefly_memory is match('^[0-9]+[kmg]$')
      - firefly_cpus | string is match('^[0-9]+(\.[0-9]+)?$')
      - firefly_pids_limit | int > 0
      - firefly_start_timeout | int > 0
      - firefly_cron_time is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
      - firefly_pg_instance is match('^[a-z0-9]+$')
      - firefly_launcher_name is match('^[^\n\[\]=]+$')
      - firefly_launcher_command is sequence and firefly_launcher_command is not string
      - firefly_launcher_command | length > 0
      - firefly_launcher_command | map('string') | select('match', '^[A-Za-z0-9._/:=@+,-]+$') | list | length == firefly_launcher_command | length
    fail_msg: >-
      Instance {{ firefly_item.name | default('?') }} of firefly_instances (roles/firefly/defaults/main.yml):
      name ^[a-z0-9]{1,14}$; image the name of a variable of images.yml (firefly_..._image)
      pinned by digest (D6); port between 1024 and 65535 (18100 and up, by convention);
      language like en_US; timezone like Europe/Madrid; log_level one of Laravel's levels;
      memory like 512m; cpus a number; pids_limit and start_timeout above 0; cron_time as
      HH:MM; pg_instance lower case letters and digits; launcher_name without [ ] or =;
      launcher_command a list of words with only letters, digits and ._/:=@+,- (no spaces,
      quotes or %), without the address.
    quiet: true

# Its home, ids and environment, read in one place (roles/service_user).
- name: Read the service user
  ansible.builtin.include_role:
    name: service_user

- name: Set the paths and environment of the service user
  ansible.builtin.set_fact:
    firefly_service_home: "{{ service_user_home }}"
    firefly_env: "{{ service_user_env }}"

- name: Check what Firefly needs
  ansible.builtin.include_tasks: checks.yml
  when: firefly_state == 'present'

# Before Firefly starts a new image, which changes the structure of its database, a
# backup (docs/services/firefly.md, 4; D11).
- name: Back up before an image change
  ansible.builtin.include_tasks: backup_before_image_change.yml
  when: firefly_state == 'present'

# Absolute paths, resolved here: role_path passed lazily to quadlet_deploy would point
# at quadlet_deploy itself.
- name: Resolve the templates
  ansible.builtin.set_fact:
    firefly_units_resolved: >-
      {{ ([] if ansible_loop.first else firefly_units_resolved)
         + [{'name': item.name, 'template': role_path ~ '/templates/' ~ item.template}] }}
  loop: "{{ firefly_quadlet_units }}"
  loop_control:
    extended: true
    label: "{{ item.name }}"

# The scheduled tasks go first when removing: their service needs Firefly's.
- name: Remove the scheduled tasks
  ansible.builtin.include_tasks: cron_remove.yml
  when: firefly_state == 'absent'

# The first start creates every table: up to 5 minutes before the healthcheck passes.
- name: Deploy with quadlet_deploy
  ansible.builtin.include_role:
    name: quadlet_deploy
  vars:
    quadlet_deploy_units: "{{ firefly_units_resolved }}"
    quadlet_deploy_images:
      - "{{ firefly_container_image }}"
    quadlet_deploy_wait_healthy:
      - "{{ firefly_name }}"
    quadlet_deploy_health_retries: 60
    quadlet_deploy_state: "{{ firefly_state }}"

- name: Install the scheduled tasks
  ansible.builtin.include_tasks: cron.yml
  when: firefly_state == 'present'

- name: Install or remove the launcher
  ansible.builtin.include_tasks: launcher.yml
