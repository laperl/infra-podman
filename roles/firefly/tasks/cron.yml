---
# Included by main.yml: Firefly's daily scheduled tasks, a plain systemd timer of the
# service user (not a container: it runs inside Firefly's). Same pattern as the backup timer.
- name: Install the service and the timer, enable and start the timer
  ansible.builtin.include_role:
    name: user_units
  vars:
    user_units_files:
      - template: firefly-cron.service.j2
        name: "{{ firefly_cron_name }}.service"
      - template: firefly-cron.timer.j2
        name: "{{ firefly_cron_name }}.timer"
    user_units_timer: "{{ firefly_cron_name }}.timer"
