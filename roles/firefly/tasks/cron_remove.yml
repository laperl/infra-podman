---
# Included by main.yml when firefly_state is absent: the timer and its service go; the
# data stays (SPEC 4.2).
- name: Stop and remove the timer and its service
  ansible.builtin.include_role:
    name: user_units
  vars:
    user_units_state: absent
    user_units_files:
      - name: "{{ firefly_cron_name }}.service"
      - name: "{{ firefly_cron_name }}.timer"
    user_units_timer: "{{ firefly_cron_name }}.timer"
