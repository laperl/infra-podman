---
# Included by main.yml. A new Firefly image changes the structure of its database when it
# starts, and the old image cannot go back: before that, the daily backup runs now (all
# the databases of the machine), as PostgreSQL does before its own image change (D11).
# Same comparison: by image ID, only when Firefly is running.
- name: Read the image of the running Firefly
  ansible.builtin.command:
    argv: [podman, container, inspect, --format, "{% raw %}{{.State.Running}} {{.Image}}{% endraw %}", "{{ firefly_name }}"]
  environment: "{{ firefly_env }}"
  become: true
  become_user: "{{ service_user }}"
  register: firefly_current
  changed_when: false
  failed_when: false
  check_mode: false

# Not present yet means it has to be pulled: a new image.
- name: Read the ID of the image to deploy
  ansible.builtin.command:
    argv: [podman, image, inspect, --format, "{% raw %}{{.Id}}{% endraw %}", "{{ firefly_container_image }}"]
  environment: "{{ firefly_env }}"
  become: true
  become_user: "{{ service_user }}"
  register: firefly_new_image
  changed_when: false
  failed_when: false
  check_mode: false
  when: firefly_current.rc == 0 and firefly_current.stdout is match('^true ')

- name: Decide whether the image changes
  ansible.builtin.set_fact:
    firefly_image_changes: >-
      {{ firefly_current.rc == 0 and firefly_current.stdout is match('^true ')
         and (firefly_new_image.rc != 0 or firefly_new_image.stdout != firefly_current.stdout.split(' ')[1]) }}

# The same tasks as PostgreSQL's (roles/postgres/tasks/backup_now.yml), not a copy.
- name: Back up first
  ansible.builtin.include_role:
    name: postgres
    tasks_from: backup_now.yml
  when: firefly_image_changes
  vars:
    postgres_env: "{{ firefly_env }}"
    postgres_service_home: "{{ firefly_service_home }}"
    postgres_backup_reason: pre-upgrade
    postgres_backup_missing_msg: >-
      {{ firefly_name }} would start a new image, which changes its database, and there is no
      backup service on {{ inventory_hostname }} to make a copy first. Apply the backup
      playbook before (D11).
    postgres_backup_plan_msg: "{{ firefly_name }} changes image: apply will run {{ infra_env }}-backup.service first."
    postgres_backup_failed_msg: >-
      The backup before changing the image of {{ firefly_name }} failed, so the image has
      NOT been changed (D11).
