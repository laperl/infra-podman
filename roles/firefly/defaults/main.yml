---
# Firefly III (phase 2, docs/services/firefly.md). One installation per machine, in the
# PostgreSQL instance firefly_pg_instance of the same machine. The image lives in
# playbooks/group_vars/all/images.yml (firefly_image).

firefly_state: present

# Port on 127.0.0.1 of the machine, the only way in (SPEC 4.4, R25). The address the
# browser opens: http://127.0.0.1:<port>.
firefly_port: 18001

# Language of new users and of the login page, and time zone (the image's own variables
# DEFAULT_LANGUAGE and TZ). The operator's choice, in the data repository.
firefly_language: en_US
firefly_timezone: UTC

# Log level of the application (APP_LOG_LEVEL). The logs go to the journal of the
# service user. The audit log is off (AUDIT_LOG_LEVEL=emergency, decided by the operator
# on 2026-11-08): Firefly says it may contain financial information.
firefly_log_level: notice

# Resource limits (R46). Podman 4.9 has no Memory= key: memory and CPU go through
# PodmanArgs (docs/COMPATIBILITY.md). Measured in DEV (docs/services/firefly.md).
firefly_memory: 512m
firefly_cpus: "1"
firefly_pids_limit: 200

# How long the start may wait for PostgreSQL to be healthy (SPEC 4.3): TimeoutStartSec.
firefly_start_timeout: 300

# Daily run of Firefly's own scheduled tasks (recurring transactions, automatic budgets,
# bill warnings): php artisan firefly-iii:cron, at this time (HH:MM). Persistent: if the
# machine was off, it runs when it starts again.
firefly_cron_time: "05:30"

# Launcher in the operator's menu (R47): its name. false in firefly_launcher for a machine
# without a desktop.
firefly_launcher: true
firefly_launcher_name: Firefly III

# Where its data is (docs/POSTGRES.md, section 6): the instance, the database and the user
# declared in postgres_hosts.yml of the data repository, with consumer: firefly.
firefly_pg_instance: main
firefly_db_name: firefly
firefly_db_user: firefly

# Home of the service user. Overwritten by the role with the real one (getent); this value
# only serves to render the templates in CI.
firefly_service_home: /home/svc_runner

# Names (SPEC 4.12). Derived; do not override.
firefly_name: "{{ infra_env }}-firefly"
firefly_volume: "{{ firefly_name }}-upload"
firefly_pg_name: "{{ infra_env }}-pg-{{ firefly_pg_instance }}"
# Created by the postgres role for the consumer firefly (SPEC 4.4, D9).
firefly_network: "{{ infra_env }}-firefly-pg-{{ firefly_pg_instance }}-net"
# KeePassXC entries <infra_site>/<key>; Podman secrets with the environment in front.
firefly_app_key_secret_key: firefly-app-key
firefly_app_key_secret: "{{ infra_env }}-{{ firefly_app_key_secret_key }}"
firefly_db_secret_key: pg-{{ firefly_pg_instance }}-{{ firefly_db_user }}-password
firefly_db_secret: "{{ infra_env }}-{{ firefly_db_secret_key }}"
firefly_cron_name: "{{ firefly_name }}-cron"

# What quadlet_deploy installs, and what CI renders (scripts/render-quadlets.yml).
firefly_quadlet_units:
  - template: firefly.container.j2
    name: "{{ firefly_name }}.container"
  - template: firefly-upload.volume.j2
    name: "{{ firefly_volume }}.volume"
