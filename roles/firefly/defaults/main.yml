---
# Firefly III (phase 2, docs/services/firefly.md), as INSTANCES (R48, docs/services/README.md).
# playbooks/firefly.yml calls this role once per item of firefly_instances, with that item
# in firefly_item. Each instance has its own container, port, network, database, secrets,
# volume, scheduled tasks and launcher: nothing is shared between instances.

# The instances of this machine, in the data repository (group_vars/firefly_hosts.yml).
# Each item:
#   name:     ^[a-z0-9]{1,14}$, only the instance, for example laptop, casa, canary, test
#             (required). The role adds the rest: prod-ff-<name> (ff = Firefly III)
#   inbound:  where it listens (required; docs/services/README.md, section 4):
#               publish: ["127.0.0.1:18100:8080"]
#             a list of <address>:<host port>:<container port>, as Podman and Docker write
#             them; Firefly listens on 8080 inside. The first one is the address the
#             launcher opens and the one Firefly gives in its links (APP_URL)
#   pg_instance:  the PostgreSQL instance of this machine with its database (default main)
#   image:    the variable of playbooks/group_vars/all/images.yml with its image (default
#             firefly_image; for example firefly_canary_image for a canary)
#   language, timezone, log_level, memory, cpus, pids_limit, start_timeout, cron_time:
#             as the defaults below
#   launcher: false on a machine without a desktop (default true)
#   launcher_name:    its name in the menu (default "Firefly III (<name>)")
#   launcher_command: the browser, as a list of words, without the address, which the role
#             adds (default [xdg-open]). For example [flatpak, run, org.mozilla.firefox, --new-window]
# Set these per instance, never as firefly_* variables in the inventory: those would win
# over every instance.
firefly_instances: []

# The instance of this call (set by the playbook). The value here only serves to render the
# templates in CI.
firefly_item: {name: ci, inbound: {publish: ["127.0.0.1:18100:8080"]}}

# --retire <name>: the instance to stop and remove, keeping its data (playbook).
firefly_retire: ""

firefly_state: present

# What each instance gets when it does not say otherwise.
firefly_instance: "{{ firefly_item.name }}"
firefly_publish: "{{ (firefly_item.inbound | default({})).publish | default([]) }}"
# Address and host port of the first one: http://127.0.0.1:18100
firefly_url: "http://{{ firefly_publish[0] | regex_replace(':[0-9]+$', '') }}"
firefly_pg_instance: "{{ firefly_item.pg_instance | default('main') }}"
firefly_image_var: "{{ firefly_item.image | default('firefly_image') }}"
firefly_container_image: "{{ lookup('ansible.builtin.vars', firefly_image_var) }}"
# Language of new users and of the login page, and time zone (DEFAULT_LANGUAGE and TZ).
firefly_language: "{{ firefly_item.language | default('en_US') }}"
firefly_timezone: "{{ firefly_item.timezone | default('UTC') }}"
# APP_LOG_LEVEL. The logs go to the journal of the service user. The audit log is off
# (AUDIT_LOG_LEVEL=emergency, decided by the operator on 2026-11-08): Firefly says it may
# contain financial information.
firefly_log_level: "{{ firefly_item.log_level | default('notice') }}"
# Resource limits (R46). Podman 4.9 has no Memory= key: memory and CPU go through
# PodmanArgs (docs/COMPATIBILITY.md). Measured in DEV (docs/services/firefly.md).
firefly_memory: "{{ firefly_item.memory | default('512m') }}"
firefly_cpus: "{{ firefly_item.cpus | default('1') }}"
firefly_pids_limit: "{{ firefly_item.pids_limit | default(200) }}"
# How long the start may wait for PostgreSQL to be healthy (SPEC 4.3): TimeoutStartSec.
firefly_start_timeout: "{{ firefly_item.start_timeout | default(300) }}"
# Daily run of Firefly's own scheduled tasks (recurring transactions, automatic budgets,
# bill warnings): php artisan firefly-iii:cron, at this time (HH:MM). Persistent: if the
# machine was off, it runs when it starts again.
firefly_cron_time: "{{ firefly_item.cron_time | default('05:30') }}"
# Launcher in the operator's menu (R47).
firefly_launcher: "{{ firefly_item.launcher | default(true) }}"
firefly_launcher_name: "{{ firefly_item.launcher_name | default('Firefly III (' ~ firefly_instance ~ ')') }}"
firefly_launcher_command: "{{ firefly_item.launcher_command | default(['xdg-open']) }}"

# Home of the service user. Overwritten by the role with the real one (getent); this value
# only serves to render the templates in CI.
firefly_service_home: /home/svc_runner

# Names (SPEC 4.12, R48). Derived; do not override. Every name the role creates starts with
# the short name of the application, ff = Firefly III: the instance laptop in prod is
# prod-ff-laptop, its database ff_laptop. Declare only the instance (name: laptop), never a
# whole name: the name check refuses hyphens, so prod-ff-prod-ff-laptop cannot happen.
firefly_short: ff
firefly_name: "{{ infra_env }}-{{ firefly_short }}-{{ firefly_instance }}"
firefly_volume: "{{ firefly_name }}-uploads"
firefly_pg_name: "{{ infra_env }}-pg-{{ firefly_pg_instance }}"
# Its database, schema and user: one database per instance (docs/POSTGRES.md, section 2),
# declared by the operator in postgres_hosts.yml with this consumer (D9).
firefly_db_name: "{{ firefly_short }}_{{ firefly_instance }}"
firefly_db_user: "{{ firefly_short }}_{{ firefly_instance }}"
firefly_consumer: "{{ firefly_short }}-{{ firefly_instance }}"
# Created by the postgres role for that consumer (SPEC 4.4).
firefly_network: "{{ infra_env }}-{{ firefly_consumer }}-pg-{{ firefly_pg_instance }}-net"
# For each secret, two names: *_secret_entry is the title of its KeePassXC entry
# (<infra_site>/<entry>) and its name in infra_secrets; *_secret is the Podman secret on
# the machine, the same with the environment in front.
firefly_app_key_secret_entry: "{{ firefly_short }}-{{ firefly_instance }}-app-key"
firefly_app_key_secret: "{{ infra_env }}-{{ firefly_app_key_secret_entry }}"
firefly_db_secret_entry: "{{ firefly_db_user | replace('_', '-') }}-db-password"
firefly_db_secret: "{{ infra_env }}-{{ firefly_db_secret_entry }}"
firefly_cron_name: "{{ firefly_name }}-cron"
firefly_launcher_file_name: infra-podman-{{ firefly_name }}.desktop

# What quadlet_deploy installs, and what CI renders (scripts/render-quadlets.yml).
firefly_quadlet_units:
  - template: firefly.container.j2
    name: "{{ firefly_name }}.container"
  - template: firefly-uploads.volume.j2
    name: "{{ firefly_volume }}.volume"
